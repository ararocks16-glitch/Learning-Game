<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Big Game of Life</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="setup" class="hidden"></div>

  <div id="app">
    <header id="hud"></header>
    <section id="needs"></section>
    <div id="warnings"></div>
    <div class="main">
      <div class="left">
        <div id="mapwrap">
          <canvas id="map" aria-label="World map. Drag to move, scroll or pinch to zoom, click a place to go there."></canvas>
          <div class="mapctl">
            <button type="button" onclick="zoomAt(1.4)" aria-label="Zoom in">＋</button>
            <button type="button" onclick="zoomAt(1 / 1.4)" aria-label="Zoom out">－</button>
            <button type="button" onclick="findMe()" aria-label="Find me">📍</button>
            <button type="button" onclick="showWorld()" aria-label="Show the whole world">🗺️</button>
          </div>
          <canvas id="minimap" aria-label="Minimap. Click to jump there."></canvas>
          <div class="maphint">Drag to explore · scroll or pinch to zoom</div>
        </div>
        <nav id="tabs"></nav>
        <main id="view"></main>
      </div>
      <aside>
        <h3>📰 What Happened</h3>
        <ul id="log"></ul>
      </aside>
    </div>
    <footer id="tip"></footer>
  </div>

  <div id="modal"><div class="modal-card"><div id="modal-body"></div><div id="modal-buttons"></div></div></div>
  <div id="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/people.js"></script>
  <script src="js/map.js"></script>
  <script src="js/world.js"></script>
  <script src="js/money.js"></script>
  <script src="js/home.js"></script>
  <script src="js/room.js"></script>
  <script src="js/door.js"></script>
  <script src="js/entrance.js"></script>
  <script src="js/interior.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/towns.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
