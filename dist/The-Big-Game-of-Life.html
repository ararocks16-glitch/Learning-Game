  travelTo(id);
}

</script>
  <script>
// ===================== WAYS TO MAKE MONEY =====================
// 20 ways to earn money besides a regular job.

const WEATHER = {
  sunny:  { name: 'Sunny',  icon: '☀️' },
  hot:    { name: 'Hot',    icon: '🥵' },
  cloudy: { name: 'Cloudy', icon: '⛅' },
  rainy:  { name: 'Rainy',  icon: '🌧️' },
};

const STOCKS = {
  BURG: { name: 'Burger Barn',  icon: '🍔', start: 40,  drift: 0.002,  vol: 0.02 },
  FARM: { name: 'Sunny Farms',  icon: '🌽', start: 25,  drift: 0.0015, vol: 0.015 },
  MALL: { name: 'Mega Mall',    icon: '🛍️', start: 60,  drift: 0.001,  vol: 0.03 },
  ZOOM: { name: 'Zoom Cars',    icon: '🚗', start: 90,  drift: 0.003,  vol: 0.045 },
  RCKT: { name: 'Rocket Tech',  icon: '🚀', start: 15,  drift: 0.004,  vol: 0.09 },
};

const BUSINESSES = {
  truck:  { name: 'Food Truck', icon: '🚚', cost: 8000,  base: 900,  costs: 450,  skills: ['cook', 'sales'] },
  bakery: { name: 'Bakery',     icon: '🥐', cost: 25000, base: 2600, costs: 1500, skills: ['cook', 'lead'] },
  store:  { name: 'Gift Shop',  icon: '🎁', cost: 60000, base: 5200, costs: 3300, skills: ['sales', 'lead', 'math'] },
};

const RENTAL = { price: 85000, rent: 380, costs: 90, sell: 80000, max: 3 };

const MONEY_IDEAS = [
  [1, '🍋', 'Lemonade stand', 'Buy supplies at the Supermarket, sell at the Park. Hot days sell best!'],
  [2, '🌱', 'Mow lawns', 'Buy a lawn mower at the Mall, then mow neighbors\' lawns from Home. Not when it rains.'],
  [3, '👶', 'Babysitting & pet sitting', 'Neighbors sometimes ask for help. Look for offers at Home.'],
  [4, '♻️', 'Recycling', 'Collect cans at the Park, turn them in at the Supermarket.'],
  [5, '🏷️', 'Yard sale', 'Sell your old stuff from Home on weekends.'],
  [6, '📖', 'Tutoring', 'Teach students at the Library when a skill is 40+.'],
  [7, '🍪', 'Bake sale', 'Bake treats at Home (uses groceries), sell them at the Park.'],
  [8, '🖼️', 'Sell art', 'Buy art supplies at the Mall, paint at Home, sell paintings at the Mall.'],
  [9, '🎸', 'Street music', 'Buy a guitar at the Mall, play for tips at the Park.'],
  [10, '🥕', 'Grow a garden', 'Buy seeds at the Supermarket, plant and water at Home, sell veggies at the Supermarket.'],
  [11, '🏪', 'Start a business', 'Get a business license at City Hall. Make — or lose — money every week.'],
  [12, '🏘️', 'Rent out a house', 'Buy a rental house at Real Estate. Tenants pay you every week.'],
  [13, '📈', 'Stock market', 'Buy and sell shares at the Bank. Prices change every day!'],
  [14, '💡', 'Invention contest', 'Work on an invention at Home, enter the fair at City Hall on Saturdays.'],
  [15, '🎟️', 'Lottery tickets', 'Scratch tickets at the Supermarket. You almost never win...'],
  [16, '🤝', 'Sponsorships', 'Win City, State or National tournaments and companies may pay you.'],
  [17, '🏅', 'Teach sports', 'At the Sports Park, teach lessons in a sport where you are level 50+.'],
  [18, '🎤', 'Talent show', 'Saturday evenings at the Theater. Sing, dance or tell jokes for prizes.'],
  [19, '🪙', 'Find treasure', 'Buy a metal detector at the Mall and search the Park. Lucky finds happen too!'],
  [20, '🏆', 'Contests & raffles', 'Art, writing and science contests at the Library. Raffle tickets at City Hall.'],
  [21, '📕', 'Write a book', 'Write 10 chapters at Home or the Library, then publish it. Good books sell for weeks!'],
];

const weekNum = () => Math.floor((S.day - 1) / 7);
function withinHours(a, b, what) {
  if (S.hour < a || S.hour > b) { nope(`${what} is only between ${fmtTime(a)} and ${fmtTime(b)}.`); return false; }
  return true;
}
function needEnergy(n = 15) {
  if (S.needs.energy < n) { nope('You\'re too tired. Get some rest first!'); return false; }
  return true;
}
const yardHomes = ['parents', 'small', 'family', 'mansion'];

function ensureMoneyState() {
  const d = {
    weather: 'sunny',
    inv: { lemonade: 0, cans: 0, treats: 0, veggies: 0, canvases: 0, seeds: 0, paintings: [] },
    garden: [], gig: null, business: null, rentals: 0,
    stocks: {}, stockPrices: null, invention: { points: 0, sessions: 0 },
    raffle: 0, sponsors: [], lottery: { spent: 0, won: 0 },
    talentWeek: -1, contests: {}, sideTotal: 0, lemonadeSold: 0,
    book: null, books: [],
  };
  for (const k in d) if (S[k] === undefined) S[k] = d[k];
  for (const k in d.inv) if (S.inv[k] === undefined) S.inv[k] = d.inv[k];
  if (!S.stockPrices) {
    S.stockPrices = {};
    for (const k in STOCKS) S.stockPrices[k] = [STOCKS[k].start];
  }
}

function sideEarn(amount, label) {
  earn(amount, label);
  S.sideTotal += amount;
  if (S.taxYear && amount > 0) S.taxYear.side += amount;
}

function moneyAssets() {
  let v = 0;
  for (const k in S.stocks) v += (S.stocks[k] || 0) * stockPrice(k);
  if (S.business) v += BUSINESSES[S.business.type].cost * 0.6;
  v += S.rentals * RENTAL.sell;
  return v;
}

// ---------- daily & weekly ----------
function moneyNewDay() {
  const r = Math.random();
  const summer = true;
  S.weather = r < 0.42 ? 'sunny' : r < (summer ? 0.62 : 0.5) ? 'hot' : r < 0.82 ? 'cloudy' : 'rainy';
  // stock prices move every day
  for (const k in STOCKS) {
    const st = STOCKS[k], h = S.stockPrices[k];
    let p = h[h.length - 1];
    const shock = (Math.random() + Math.random() + Math.random() - 1.5) * 2 * st.vol;
    p = Math.max(1, p * (1 + st.drift + shock));
    if (Math.random() < 0.02) p *= Math.random() < 0.5 ? 0.75 : 1.3; // big news!
    h.push(Math.round(p * 100) / 100);
    if (h.length > 30) h.shift();
  }
  // garden
  S.garden.forEach(pl => {
    if (S.weather === 'rainy') pl.lastWatered = S.day;
    if (!pl.dead && S.day - pl.lastWatered > 2) { pl.dead = true; log('🥀 One of your garden plants dried up. Water your garden every day or two!', 'bad'); }
  });
  // babysitting / pet sitting offers
  if (S.gig && S.gig.day < S.day) S.gig = null;
  if (!S.gig && Math.random() < 0.3) {
    const pet = Math.random() < 0.5;
    const hours = 2 + Math.floor(Math.random() * 3);
    S.gig = pet
      ? { kind: 'pet', name: ['Biscuit the dog', 'Whiskers the cat', 'Pepper the parrot', 'Nugget the hamster'][Math.floor(Math.random() * 4)], hours, pay: hours * 11, skill: 'animal', day: S.day }
      : { kind: 'baby', name: ['the Garcia kids', 'little Maya', 'the twins next door', 'baby Leo'][Math.floor(Math.random() * 4)], hours, pay: hours * 13, skill: 'aid', day: S.day };
    log(`📨 A neighbor asked you to ${S.gig.kind === 'pet' ? 'pet sit' : 'babysit'} today. Check Home!`);
  }
}

function moneyWeekly() {
  const lines = [];
  let total = 0;
  if (S.business) {
    const b = BUSINESSES[S.business.type];
    const skill = b.skills.reduce((a, s) => a + skillLevel(s), 0) / b.skills.length;
    const luck = 0.55 + Math.random() * 0.8;
    const sales = Math.round(b.base * luck * (0.7 + skill / 100) * (1 + S.business.worked * 0.12));
    const profit = sales - b.costs;
    lines.push([`${b.icon} ${b.name}: sales ${money(sales)} − costs ${money(b.costs)} (rent, workers, supplies)`, profit]);
    total += profit;
    S.business.history.push(profit);
    if (S.business.history.length > 8) S.business.history.shift();
    S.business.worked = 0;
  }
  for (let i = 0; i < S.rentals; i++) {
    if (Math.random() < 0.1) { lines.push([`🏘️ Rental #${i + 1}: empty this week (no tenant)`, -RENTAL.costs]); total -= RENTAL.costs; continue; }
    let net = RENTAL.rent - RENTAL.costs;
    let note = `rent ${money(RENTAL.rent)} − tax & upkeep ${money(RENTAL.costs)}`;
    if (Math.random() < 0.12) { const fix = 200 + Math.round(Math.random() * 500); net -= fix; note += ` − repair ${money(fix)}`; }
    lines.push([`🏘️ Rental #${i + 1}: ${note}`, net]); total += net;
  }
  S.sponsors = S.sponsors.filter(sp => {
    lines.push([`🤝 Sponsor ${sp.name} (${sp.weeks} weeks left)`, sp.weekly]); total += sp.weekly;
    sp.weeks--;
    return sp.weeks > 0;
  });
  S.books = S.books.filter(bk => {
    const copies = Math.max(0, Math.round(bk.base * bk.fade * (0.6 + Math.random() * 0.8)));
    const pay = Math.round(copies * bk.perCopy);
    lines.push([`📕 "${esc(bk.title)}": sold ${copies} copies × $${bk.perCopy.toFixed(2)}`, pay]); total += pay;
    bk.sold += copies;
    bk.fade *= bk.decay;
    bk.weeks++;
    return bk.fade > 0.08;
  });
  if (S.raffle > 0) {
    let won = 0;
    for (let i = 0; i < S.raffle; i++) if (Math.random() < 1 / 40) won += 250;
    lines.push([`🎟️ Raffle drawing (${S.raffle} ticket${S.raffle > 1 ? 's' : ''})${won ? ' — YOU WON!' : ' — no win'}`, won]); total += won;
    S.raffle = 0;
  }
  if (!lines.length) return;
  if (total >= 0) sideEarn(total, 'Side income this week'); else charge(-total, 'Side business losses');
  queueModal(`<h2>💼 Side Income Report</h2>
    <table class="stub">${lines.map(l => `<tr class="${l[1] < 0 ? 'minus' : 'plus'}"><td>${l[0]}</td><td>${l[1] < 0 ? '-' : '+'}${money(Math.abs(l[1]))}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td>${total < 0 ? '-' : '+'}${money(Math.abs(total))}</td></tr></table>
    ${total < 0 ? '<p class="lesson">💡 Businesses and rentals can LOSE money some weeks. That\'s the risk of owning things.</p>' : '<p class="lesson">💡 Money that comes in without working a job is called "passive income".</p>'}`);
}

function moneyEvents(ev) {
  ev.push({ w: 1.5, f: () => { const v = 20 + Math.round(Math.random() * 130); sideEarn(v, 'Sold an old find'); return ['📦 Attic Treasure', `You found an old baseball card in a box and sold it to a collector for ${money(v)}!`, 'Old things can be worth money to collectors.']; } });
  ev.push({ w: 1, f: () => { const v = 1 + Math.round(Math.random() * 9); sideEarn(v, 'Found coins'); return ['🪙 Coins!', `You found ${money(v)} in coins under the couch cushions.`, '']; } });
}

function sponsorChance(sp, tid) {
  const t = { city: [0.4, 60], state: [0.6, 250], national: [0.85, 1000] }[tid];
  if (!t || Math.random() > t[0]) return;
  const brands = ['ZoomFast Shoes', 'Fizzy Pop', 'PowerUp Bars', 'SuperSport Gear', 'Splash Water'];
  const name = brands[Math.floor(Math.random() * brands.length)];
  S.sponsors.push({ name, sport: sp, weekly: t[1], weeks: 8 });
  unlock('sponsored');
  log(`🤝 ${name} wants to sponsor you! They'll pay ${money(t[1])} every week for 8 weeks.`, 'good');
  queueModal(`<h2>🤝 You Got a Sponsor!</h2><p><b>${name}</b> saw you win and wants you to wear their logo.</p><p>They'll pay you <b>${money(t[1])} every week for 8 weeks</b>.</p><p class="lesson">💡 Famous athletes earn lots of money from sponsors, not just from prizes.</p>`);
}

// ---------- 1. lemonade ----------
function lemonadeStand() {
  if (!withinHours(9, 18, 'The lemonade stand') || !needEnergy()) return;
  if (S.inv.lemonade < 1) return nope('No lemonade! Buy supplies at the 🛒 Supermarket.');
  if (S.weather === 'rainy') return nope('Nobody buys lemonade in the rain. Try another day!');
  pass(2, 'awake');
  const want = { hot: 26, sunny: 16, cloudy: 8 }[S.weather] + (isWeekend() ? 6 : 0) + Math.round(S.skills.sales / 10) + Math.floor(Math.random() * 6);
  const sold = Math.min(S.inv.lemonade, want);
  S.inv.lemonade -= sold;
  S.lemonadeSold += sold;
  const price = 1.5;
  const income = sold * price, cost = sold * 0.6;
  sideEarn(income, 'Lemonade stand');
  addSkill('sales', 1);
  if (S.lemonadeSold >= 50) unlock('lemonade');
  log(`🍋 You sold ${sold} cups of lemonade for ${money(income)}. (Supplies cost about ${money(cost)}, so profit ≈ ${money(income - cost)}.)`, 'good');
  showModal(`<h2>🍋 Lemonade Stand</h2><p>Weather: ${WEATHER[S.weather].icon} ${WEATHER[S.weather].name}</p>
    <table class="stub"><tr><td>Sold ${sold} cups × $1.50</td><td class="plus">+${money(income)}</td></tr>
    <tr><td>Supplies used (lemons, sugar, cups)</td><td class="minus">-${money(cost)}</td></tr>
    <tr class="total"><td>Profit</td><td>${money(income - cost)}</td></tr></table>
    ${sold === S.inv.lemonade + sold && sold < want ? '<p>You sold out! Buy more supplies.</p>' : ''}
    <p class="lesson">💡 Profit = money in − what it cost you. ${S.weather === 'hot' ? 'Hot days = thirsty people!' : 'Hot days sell more lemonade.'}</p>`, [{ label: 'OK' }]);
  done(false);
}

// ---------- 2. lawns ----------
function mowLawns() {
  if (!has('mower')) return nope('You need a lawn mower. Buy one at the 🛍️ Mall.');
  if (S.weather === 'rainy') return nope('The grass is too wet to mow today.');
  if (S.today.mowed) return nope('You already mowed lawns today.');
  if (!withinHours(8, 18, 'Mowing') || !needEnergy(25)) return;
  const lawns = 1 + Math.floor(Math.random() * 3) + (S.skills.fit > 40 ? 1 : 0);
  pass(lawns * 1, 'sport');
  S.today.mowed = true;
  addSkill('fit', 1.5);
  sideEarn(lawns * 20, 'Mowed lawns');
  log(`🌱 You mowed ${lawns} neighbor lawn${lawns > 1 ? 's' : ''} and earned ${money(lawns * 20)}. (Sweaty! Shower time.)`, 'good');
  done();
}

// ---------- 3. babysitting / pet sitting ----------
function doGig() {
  const g = S.gig; if (!g) return;
  if (!withinHours(8, 21, 'This job') || !needEnergy(20)) return;
  pass(g.hours, 'study');
  const lvl = skillLevel(g.skill);
  const good = Math.random() < 0.5 + lvl / 100;
  const tip = good ? Math.round(g.pay * 0.2) : 0;
  sideEarn(g.pay + tip, g.kind === 'pet' ? 'Pet sitting' : g.kind === 'snow' ? 'Shoveling snow' : 'Babysitting');
  if (g.kind === 'snow') { log(`🌨️ You shoveled ${g.name}'s driveway. They paid you ${money(g.pay)}! Your arms are tired.`, 'good'); S.gig = null; return done(); }
  addSkill(g.skill, 2);
  log(g.kind === 'pet'
    ? `🐾 You took care of ${g.name} for ${g.hours} hours. Earned ${money(g.pay)}${tip ? ` + ${money(tip)} tip` : ''}!`
    : `👶 You babysat ${g.name} for ${g.hours} hours. Earned ${money(g.pay)}${tip ? ` + ${money(tip)} tip for doing great` : ''}!`, 'good');
  S.gig = null;
  done();
}

// ---------- 4. recycling ----------
function collectCans() {
  if (!withinHours(6, 21, 'Collecting cans') || !needEnergy()) return;
  pass(1, 'awake');
  const n = 6 + Math.floor(Math.random() * 15);
  S.inv.cans += n;
  S.needs.hygiene = clamp(S.needs.hygiene - 8);
  log(`♻️ You picked up ${n} cans and bottles. You have ${S.inv.cans}. Turn them in at the Supermarket. (Wash your hands!)`);
  S.handsDirty = true;
  done();
}
function recycle() {
  if (S.inv.cans < 1) return nope('You have no cans. Collect some at the 🌳 Park.');
  const v = Math.round(S.inv.cans * 10) / 100;
  sideEarn(v, 'Recycling');
  log(`♻️ The recycling machine took ${S.inv.cans} cans and paid you ${money(v)} (10¢ each). Good for the planet too!`, 'good');
  S.inv.cans = 0;
  done();
}

// ---------- 5. yard sale ----------
function yardSale() {
  if (!yardHomes.includes(S.home)) return nope('You need a yard! Apartments don\'t have one.');
  if (!isWeekend()) return nope('Yard sales happen on weekends.');
  if (!withinHours(8, 14, 'A yard sale')) return;
  const things = ITEMS.filter(i => has(i.id) && !['car', 'newcar'].includes(i.id))
    .concat(Object.keys(SPORTS).filter(k => S.owned['gear_' + k]).map(k => ({ id: 'gear_' + k, name: SPORTS[k].gear.name, icon: SPORTS[k].icon, price: SPORTS[k].gear.price })));
  if (!things.length) return nope('You don\'t own anything to sell yet.');
  showModal(`<h2>🏷️ Yard Sale</h2><p>Pick what to sell. Used stuff sells for about <b>half</b> what you paid, and some things might not sell.</p>
    <div class="claims">${things.map(t => `<label class="claim"><input type="checkbox" value="${t.id}"><span>${t.icon} ${t.name}</span><span class="lvl">paid ${money(t.price)}</span></label>`).join('')}</div>`,
  [{ label: 'Cancel', cls: 'ghost' }, { label: 'Hold the sale (4 hrs)', cls: 'primary', keepOpen: true, fn: () => {
    const picks = [...document.querySelectorAll('.claims input:checked')].map(i => i.value);
    if (!picks.length) { nope('Pick at least one thing.'); return; }
    closeModal();
    pass(4, 'awake');
    const lines = [];
    let total = 0;
    picks.forEach(id => {
      const t = things.find(x => x.id === id);
      if (Math.random() < 0.75) {
        const v = Math.round(t.price * (0.35 + Math.random() * 0.25));
        total += v; delete S.owned[id];
        lines.push(`<li class="win">${t.icon} ${t.name}: sold for ${money(v)}</li>`);
      } else lines.push(`<li class="loss">${t.icon} ${t.name}: nobody bought it</li>`);
    });
    if (total) sideEarn(total, 'Yard sale');
    log(`🏷️ Yard sale: you made ${money(total)}.`, 'good');
    showModal(`<h2>🏷️ Yard Sale Results</h2><ul class="bracket">${lines.join('')}</ul><p>Total: <b>${money(total)}</b></p>
      <p class="lesson">💡 Most things lose value once you buy them. That's called depreciation.</p>`, [{ label: 'OK' }]);
    done(false);
  } }]);
}

// ---------- 6. tutoring ----------
function tutor(skill) {
  if (S.skills[skill] < 40) return nope(`You need ${SKILLS[skill].name} level 40 to tutor.`);
  if (!withinHours(14, 20, 'Tutoring (after school)') || !needEnergy(20)) return;
  pass(2, 'study');
  const pay = Math.round(2 * 15 * (S.skills[skill] / 50));
  sideEarn(pay, `Tutoring ${SKILLS[skill].name}`);
  addSkill(skill, 1); addSkill('comm', 1);
  log(`📖 You tutored a student in ${SKILLS[skill].name} for 2 hours and earned ${money(pay)}.`, 'good');
  done();
}

// ---------- 7. bake sale ----------
function bake() {
  if (S.groceries < 1) return nope('You need groceries to bake with.');
  if (!needEnergy()) return;
  S.groceries--;
  pass(2, 'study');
  const n = 6 + Math.floor(S.skills.cook / 10);
  S.inv.treats += n;
  addSkill('cook', 2);
  log(`🍪 You baked ${n} cookies and cupcakes! (You have ${S.inv.treats}.) Sell them at the Park.`);
  done();
}
function bakeSale() {
  if (S.inv.treats < 1) return nope('Bake some treats at home first!');
  if (!withinHours(9, 18, 'A bake sale') || !needEnergy()) return;
  pass(2, 'awake');
  const price = Math.round((2 + S.skills.cook / 25) * 4) / 4;
  const want = 6 + Math.floor(Math.random() * 10) + (isWeekend() ? 5 : 0) - (S.weather === 'rainy' ? 6 : 0);
  const sold = Math.max(0, Math.min(S.inv.treats, want));
  S.inv.treats -= sold;
  sideEarn(sold * price, 'Bake sale');
  addSkill('sales', 1);
  log(`🍪 Bake sale: sold ${sold} treats at $${price.toFixed(2)} each = ${money(sold * price)}. ${S.inv.treats ? `${S.inv.treats} left.` : 'Sold out!'}`, 'good');
  done();
}

// ---------- 8. art ----------
function paint() {
  if (S.inv.canvases < 1) return nope('You need art supplies. Buy them at the 🛍️ Mall.');
  if (!needEnergy()) return;
  S.inv.canvases--;
  pass(2, 'relax');
  const q = Math.max(1, Math.round(S.skills.art + (Math.random() - 0.5) * 30));
  S.inv.paintings.push(q);
  addSkill('art', 2.5);
  const words = q > 70 ? 'a masterpiece' : q > 45 ? 'a really nice painting' : q > 20 ? 'a pretty good painting' : 'a... colorful painting';
  log(`🖼️ You painted ${words} (quality ${q}).`);
  done();
}
function sellPaintings() {
  if (!S.inv.paintings.length) return nope('You have no paintings. Paint some at home!');
  let total = 0;
  S.inv.paintings.forEach(q => total += Math.round(10 + q * q / 12));
  sideEarn(total, 'Sold paintings');
  unlock('artist');
  log(`🖼️ The art gallery bought your ${S.inv.paintings.length} painting${S.inv.paintings.length > 1 ? 's' : ''} for ${money(total)}!`, 'good');
  S.inv.paintings = [];
  done();
}

// ---------- 9. street music ----------
function busk() {
  if (!has('guitar')) return nope('You need a guitar. Buy one at the 🛍️ Mall.');
  if (S.weather === 'rainy') return nope('It\'s raining — nobody is at the park.');
  if (!withinHours(9, 21, 'Playing music') || !needEnergy()) return;
  pass(2, 'relax');
  const tips = Math.round((3 + S.skills.music / 2.5) * (0.5 + Math.random()) * (isWeekend() ? 1.4 : 1));
  sideEarn(tips, 'Music tips');
  addSkill('music', 2);
  log(`🎸 You played music at the park. People tossed ${money(tips)} into your guitar case!`, 'good');
  done();
}

// ---------- 10. garden ----------
function gardenSize() { return { parents: 2, small: 3, family: 4, mansion: 6 }[S.home] || 0; }
function plant() {
  const size = gardenSize();
  if (!size) return nope('You need a home with a yard to grow a garden.');
  S.garden = S.garden.filter(p => !p.dead);
  if (S.garden.length >= size) return nope('Your garden is full!');
  if (S.inv.seeds < 1) return nope('You need seeds. Buy them at the 🛒 Supermarket.');
  S.inv.seeds--;
  pass(0.5, 'awake');
  const crop = ['🥕', '🍅', '🥬', '🌽', '🥒'][Math.floor(Math.random() * 5)];
  S.garden.push({ crop, planted: S.day, lastWatered: S.day, dead: false });
  log(`🌱 You planted ${crop} seeds. Water them every day or two. Ready in 6 days!`);

function stockPrice(k) { const h = S.stockPrices[k]; return h[h.length - 1]; }
function trade(k, n) {
  const p = stockPrice(k);
  if (n > 0) {
    if (!spend(p * n, `Bought ${n} ${k} stock`)) return;
    S.stocks[k] = (S.stocks[k] || 0) + n;
    S.stockCost = S.stockCost || {};
    S.stockCost[k] = (S.stockCost[k] || 0) + p * n;
    unlock('investor');
    log(`📈 You bought ${n} share${n > 1 ? 's' : ''} of ${STOCKS[k].name} at ${money(p)}.`);
  } else {
    const have = S.stocks[k] || 0;
    const m = n === -Infinity ? have : Math.min(have, -n);
    if (!m) return nope('You don\'t own any of that stock.');
    const avg = (S.stockCost[k] || 0) / have;
    S.stocks[k] = have - m;
    S.stockCost[k] = avg * S.stocks[k];
    const got = p * m, gain = got - avg * m;
    earn(got, `Sold ${m} ${k} stock`);
    log(`📉 You sold ${m} share${m > 1 ? 's' : ''} of ${STOCKS[k].name} for ${money(got)}. ${gain >= 0 ? `Profit: ${money(gain)} 🎉` : `Loss: ${money(-gain)} 😬`}`, gain >= 0 ? 'good' : 'bad');
  }
  done();
}
function sparkline(h) {
  const w = 90, ht = 24, mn = Math.min(...h), mx = Math.max(...h), rg = mx - mn || 1;
  const pts = h.map((v, i) => `${(i / Math.max(1, h.length - 1) * w).toFixed(1)},${(ht - 2 - (v - mn) / rg * (ht - 4)).toFixed(1)}`).join(' ');
  const up = h[h.length - 1] >= h[0];
  return `<svg class="spark ${up ? 'up' : 'down'}" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;
}

   { label: '🖨️ Self-publish ($250)', cls: 'ghost', keepOpen: true, fn: () => finishBook('self') },
   { label: '🏢 Send to publisher', cls: 'primary', keepOpen: true, fn: () => finishBook('publisher') }]);

function finishBook(how) {
  const title = ($('#booktitle').value || '').trim();
  if (!title) { nope('Give your book a title!'); return; }
  const genre = $('#bookgenre').value;
  const q = bookQuality();
  closeModal();

    S.books.push({ title, genre, q, how, base: 4 + q / 3, perCopy: 4, fade: 1, decay: 0.8, sold: 0, weeks: 0 });

    S.books.push({ title, genre, q, how, base: (12 + q * 1.2) * (best ? 4 : 1), perCopy: 1.5, fade: 1, decay: 0.86, sold: 0, weeks: 0, best });
    log(`🎉 A publisher bought "${esc(title)}"! They paid you a ${money(advance)} advance.${best ? ' It\'s a BESTSELLER!' : ''}`, 'good');
    queueModal(`<h2>🎉 A Publisher Said YES!</h2><p>They will publish <b>"${esc(title)}"</b> and paid you <b>${money(advance)}</b> up front.</p>${best ? '<p>🌟 <b>Bookstores are calling it a BESTSELLER!</b></p>' : ''}<p>You'll also get $1.50 for every copy sold, every Monday.</p>`);

  unlock('author');
  S.book = null;
  done();
}

    rows.push(mrow('♻️', 'Recycling machine', `10¢ per can · you have ${S.inv.cans}`, b(`Recycle (${money(S.inv.cans / 10)})`, 'recycle()', 'primary', !S.inv.cans)));
    rows.push(mrow('🥕', 'Sell homegrown veggies', `$3 each · you have ${S.inv.veggies}`, b('Sell', 'sellVeggies()', 'primary', !S.inv.veggies)));
    rows.push(mrow('🎟️', 'Scratch lottery ticket ($2)', `You've spent ${money(S.lottery.spent)} and won ${money(S.lottery.won)}`, b('Buy & scratch', 'scratchTicket()', 'ghost')));
  }
  if (pid === 'mall') {
    const val = S.inv.paintings.reduce((a, q) => a + Math.round(10 + q * q / 12), 0);
    rows.push(mrow('🖼️', 'Art Gallery: sell your paintings', `${S.inv.paintings.length} paintings · offer: ${money(val)}`, b('Sell all', 'sellPaintings()', 'primary', !S.inv.paintings.length)));
  }
  if (pid === 'library') {
    LIBRARY_SKILLS.forEach(k => rows.push(mrow(SKILLS[k].icon, `Tutor ${SKILLS[k].name}`, S.skills[k] >= 40 ? `2 hrs · about ${money(30 * S.skills[k] / 50)} · 2–8 PM` : `Needs level 40 (you: ${Math.round(S.skills[k])})`, b('Tutor', `tutor('${k}')`, 'primary', S.skills[k] < 40))));
    const ch2 = S.book ? S.book.chapters.length : 0;
    rows.push(mrow('📕', 'Write a chapter of your book (nice and quiet here)', `${ch2}/10 chapters`, ch2 >= 10 ? b('Publish', 'publishBook()') : b('Write chapter', 'writeChapter()')));
    Object.entries(CONTESTS).forEach(([k, [name, sk]]) => rows.push(mrow('🏆', name, `$5 entry · prizes $200 / $75 / $25 · uses ${SKILLS[sk].name} (${Math.round(S.skills[sk])})${S.contests[k] === weekNum() ? ' · entered this week' : ''}`, b('Enter', `enterContest('${k}')`, 'primary', S.contests[k] === weekNum()))));
  }
  if (pid === 'sports') {
    Object.entries(SPORTS).forEach(([k, s]) => { if (S.sports[k] >= 50) rows.push(mrow(s.icon, `Teach ${s.name}`, `2 hrs · once a day`, b('Teach', `teachSport('${k}')`, 'primary', S.today['teach_' + k]))); });
    if (!rows.length) rows.push(mrow('🏅', 'Teach sports lessons', 'Reach level 50 in any sport to teach it.', ''));
    S.sponsors.forEach(sp => rows.push(mrow('🤝', `Sponsor: ${sp.name}`, `${money(sp.weekly)}/week · ${sp.weeks} weeks left`, '')));
  }
  if (pid === 'bank') return stockMarket();
  if (pid === 'realestate') {
    rows.push(mrow('🏘️', `Rental houses: ${S.rentals}/${RENTAL.max}`, `Costs ${money(RENTAL.price)} · tenant pays ${money(RENTAL.rent)}/wk · you pay ${money(RENTAL.costs)}/wk + repairs`,
      b('Buy rental', 'buyRental()', 'primary', S.rentals >= RENTAL.max) + (S.rentals ? b('Sell one', 'sellRental()', 'ghost') : '')));
    return moneyCard('Be a Landlord', rows);
  }
  if (pid === 'cityhall') {
    if (S.business) {
      const bz = BUSINESSES[S.business.type];
      const hist = S.business.history.length ? S.business.history.map(v => `<span class="${v < 0 ? 'neg' : 'pos'}">${v < 0 ? '-' : '+'}${money(Math.abs(v))}</span>`).join(' ') : 'no weeks yet';
      rows.push(mrow(bz.icon, `Your ${bz.name}`, `Past weeks: ${hist} · shifts this week: ${S.business.worked}/5`, b('Work a shift (8 hrs)', 'workBusiness()') + b('Sell', 'sellBusiness()', 'ghost')));
    } else {
      Object.entries(BUSINESSES).forEach(([k, bz]) => rows.push(mrow(bz.icon, `Start a ${bz.name}`, `${money(bz.cost)} · costs ${money(bz.costs)}/week · good skills: ${bz.skills.map(s => SKILLS[s].name).join(', ')}`, b('Start', `startBusiness('${k}')`))));
    }
    rows.push(mrow('💡', 'Invention Fair (Saturdays 9 AM–3 PM)', S.invention.sessions >= 5 ? `Your ${S.invention.idea} is ready! Prizes $3,000 / $1,000 / $300` : `Finish your invention first (${S.invention.sessions}/5 sessions at Home)`, b('Enter', 'inventionFair()', 'primary', S.invention.sessions < 5)));
    rows.push(mrow('🎟️', 'Raffle ticket ($5)', `Drawing every Monday · $250 prize · you have ${S.raffle}`, b('Buy ticket', 'buyRaffle()', 'ghost')));
  }
  if (pid === 'theater') {
    rows.push(mrow('🎭', 'Talent Show — Saturdays 5–8:30 PM', `$10 entry · prizes $500 / $200 / $75${S.talentWeek === weekNum() ? ' · you performed this week' : ''}`,
      Object.entries(ACTS).map(([k, [label]]) => b(label, `talentShow('${k}')`, 'primary', S.talentWeek === weekNum())).join('')));
  }
  return moneyCard('Ways to Make Money Here', rows);
}

function stockMarket() {
  const rows = Object.entries(STOCKS).map(([k, st]) => {
    const h = S.stockPrices[k], p = stockPrice(k);
    const prev = h.length > 1 ? h[h.length - 2] : p;
    const ch = (p - prev) / prev * 100;
    const own = S.stocks[k] || 0;
    const avg = own ? (S.stockCost[k] / own) : 0;
    const gain = own ? (p - avg) * own : 0;
    return `<tr><td><b>${st.icon} ${st.name}</b><br><small class="muted">${k}</small></td>
      <td class="num">${money(p)}<br><small class="${ch >= 0 ? 'pos' : 'neg'}">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(1)}%</small></td>
      <td>${sparkline(h)}</td>
      <td class="num">${own}${own ? `<br><small class="${gain >= 0 ? 'pos' : 'neg'}">${gain >= 0 ? '+' : '-'}${money(Math.abs(gain))}</small>` : ''}</td>
      <td class="tbtn">${b('Buy 1', `trade('${k}',1)`)}${b('Buy 10', `trade('${k}',10)`)}${b('Sell 1', `trade('${k}',-1)`, 'ghost', !own)}${b('Sell all', `trade('${k}',-Infinity)`, 'ghost', !own)}</td></tr>`;
  }).join('');
  let worth = 0; for (const k in S.stocks) worth += (S.stocks[k] || 0) * stockPrice(k);
  return `<div class="card money"><h3>📈 Stock Market</h3>
    <p class="muted">Buy a "share" and you own a tiny piece of a company. Prices change every day. If you sell for more than you paid, you make money. If not, you lose money! Your stocks are worth <b>${money(worth)}</b>.</p>
    <div class="tablewrap"><table class="stocks"><tr><th>Company</th><th>Price</th><th>Last 30 days</th><th>You own</th><th></th></tr>${rows}</table></div>
    <p class="lesson">💡 🚀 Rocket Tech can go up or down a LOT. 🌽 Sunny Farms moves slowly. Risky stocks can win big or lose big.</p></div>`;
}

function viewMoney() {
  const income = [];
  if (S.job) income.push(`💼 Job: about ${money(S.job.wage * 40 * 0.78)}/week after taxes`);
  if (S.business) income.push(`${BUSINESSES[S.business.type].icon} ${BUSINESSES[S.business.type].name}`);
  if (S.rentals) income.push(`🏘️ ${S.rentals} rental house${S.rentals > 1 ? 's' : ''}`);
  S.books.forEach(bk => income.push(`📕 "${esc(bk.title)}": ${bk.sold} copies sold`));
  S.sponsors.forEach(sp => income.push(`🤝 ${sp.name}: ${money(sp.weekly)}/week`));
  let stockWorth = 0; for (const k in S.stocks) stockWorth += (S.stocks[k] || 0) * stockPrice(k);
  const inv = [
    ['🍋', 'Lemonade cups', S.inv.lemonade], ['♻️', 'Cans', S.inv.cans], ['🍪', 'Treats', S.inv.treats],
    ['🖼️', 'Paintings', S.inv.paintings.length], ['🎨', 'Canvases', S.inv.canvases], ['🌱', 'Seed packs', S.inv.seeds], ['🥕', 'Veggies', S.inv.veggies],
  ].filter(x => x[2] > 0);
  return `<h2>💰 Ways to Make Money</h2>
    <p>Besides a job, there are lots of ways to earn money. You've made <b>${money(S.sideTotal)}</b> from side money so far.</p>
    <div class="row">${income.map(i => `<span class="chip good">${i}</span>`).join('')}${stockWorth ? `<span class="chip">📈 Stocks worth ${money(stockWorth)}</span>` : ''}</div>
    ${inv.length ? `<h3>Your stuff to sell</h3><div class="row">${inv.map(x => `<span class="chip">${x[0]} ${x[1]}: <b>${x[2]}</b></span>`).join('')}</div>` : ''}
    <div class="grid ideas">${MONEY_IDEAS.map(([n, icon, name, how]) => `<div class="card idea"><span class="num">${n}</span><div><b>${icon} ${name}</b><p class="muted small">${how}</p></div></div>`).join('')}</div>`;
}

</script>
  <script>
// ===================== YOUR HOME =====================
// Stuff you need (toilet, fridge, bed...), furniture, decorations,
// paintings on the walls, and a picture of the inside of your home.

// What each home already has when you move in.
const HOME_INCLUDES = {
  parents: ['toilet', 'shower', 'fridge', 'stove', 'mattress', 'table', 'washer'],
  shared:  ['toilet', 'shower', 'fridge', 'stove'],
  studio:  ['toilet', 'shower'],
  onebed:  ['toilet', 'shower'],
  small:   [],
  family:  [],
  mansion: [],
};
const WALL_SLOTS = { parents: 2, shared: 2, studio: 3, onebed: 4, small: 5, family: 6, mansion: 8 };
const WALL_COLORS = ['#f6ecd2', '#dbeaf7', '#d9f0dd', '#f7dcdc', '#e6ddf5', '#fde3c4', '#e9e9e9', '#cfe4e8'];
const ESSENTIALS = [
  ['toilet', '🚽', 'Toilet', 'Without one you have to go to a public restroom!'],
  ['shower', '🚿', 'Shower', 'Or a bathtub. You need one to get clean at home.'],
  ['fridge', '🧊', 'Fridge', 'Without one, most of your food goes bad overnight.'],
  ['stove', '🍳', 'Stove', 'You need it to cook meals.'],
  ['mattress', '🛏️', 'Bed', 'Sleeping on the floor gives you less energy.'],
];
const PANTRY = {
  fruit:  { name: 'Fruit',        icon: '🍎', food: 15, fun: 0, health: 3, perish: true },
  chips:  { name: 'Chips',        icon: '🥔', food: 12, fun: 6, health: -1 },
  cereal: { name: 'Cereal & milk', icon: '🥣', food: 25, fun: 2, health: 1, perish: true },
  pizza:  { name: 'Frozen pizza', icon: '🍕', food: 40, fun: 6, health: -1, perish: true, hot: true },
};

function hasF(f) {
  if (f === 'mattress') return has('mattress') || has('bed') || (HOME_INCLUDES[S.home] || []).includes('mattress');
  if (f === 'shower') return has('shower') || has('bathtub') || (HOME_INCLUDES[S.home] || []).includes('shower');
  return has(f) || (HOME_INCLUDES[S.home] || []).includes(f);
}
const atHome = () => S.loc === 'home';
function quickToilet() {
  if (atHome() && !S.doorOpen) S.doorOpen = true;   // hurry inside!
  if (atHome() && !homeToilet()) return;
  useToilet(); done();
}

function ensureHomeState() {
  if (S.supplies === undefined) S.supplies = 12;
  if (!S.pantry) S.pantry = { fruit: 0, chips: 0, cereal: 0, pizza: 0 };
  if (!S.walls) S.walls = [];
  if (!S.wallColor) S.wallColor = WALL_COLORS[0];
  // older saves: don't take away a toilet people already had
  if (!S.homeV2) {
    S.homeV2 = true;
    if (S.home !== 'parents') ['toilet', 'shower', 'fridge', 'stove', 'mattress'].forEach(f => S.owned[f] = true);
  }
}

function cozy() {
  let c = 0;
  ITEMS.forEach(it => { if (it.cozy && (has(it.id) || (HOME_INCLUDES[S.home] || []).includes(it.id))) c += it.cozy; });
  S.walls.forEach(w => c += w.kind === 'famous' ? 8 : w.kind === 'print' ? 1 : 1 + Math.round(w.q / 25));
  if (S.wallColor !== WALL_COLORS[0]) c += 1;
  return c;
}

// ---------- daily ----------
function homeNewDay() {
  if (!hasF('fridge')) {
    const lost = [];
    if (S.groceries > 2) { lost.push(`${S.groceries - 2} meals`); S.groceries = 2; }
    Object.entries(PANTRY).forEach(([k, p]) => { if (p.perish && S.pantry[k] > 0) { lost.push(`${S.pantry[k]} ${p.name.toLowerCase()}`); S.pantry[k] = 0; } });
    if (lost.length) log(`🤢 Your food went bad overnight (${lost.join(', ')}). You need a fridge! Buy one at the 🛍️ Mall.`, 'bad');
  }
}

// ---------- bathroom & supplies ----------
function homeToilet() {
  if (!hasF('toilet')) { nope('There\'s no toilet in your home! Buy one at the 🛍️ Mall, or use a public restroom.'); return false; }
  if (S.home !== 'parents') {
    if (S.supplies <= 0) {
      S.needs.hygiene = clamp(S.needs.hygiene - 15); S.needs.fun = clamp(S.needs.fun - 5);
      log('🧻 Oh no — you ran out of toilet paper! Buy Household Supplies at the 🛒 Supermarket.', 'bad');
    } else S.supplies--;
  }
  return true;
}
function homeShower() {
  if (!hasF('shower')) return nope('You don\'t have a shower or bathtub! Buy one at the 🛍️ Mall.');
  pass(0.5);
  const soap = S.home === 'parents' || S.supplies > 0;
  if (S.home !== 'parents' && S.supplies > 0) S.supplies--;
  S.needs.hygiene = soap ? 100 : 75;
  S.today.showered = true;
  log(soap ? '🚿 You took a shower. Squeaky clean!' : '🚿 You showered, but you\'re out of soap and shampoo. Only kind of clean. (Buy Household Supplies!)');
}
function takeBath() {
  if (!has('bathtub')) return nope('You need a bathtub.');
  pass(1, 'relax');
  S.needs.hygiene = 100; S.needs.fun = clamp(S.needs.fun + 12); S.today.showered = true;
  if (S.home !== 'parents' && S.supplies > 0) S.supplies--;
  log('🛁 You took a long bubble bath. So relaxing!');
}

// ---------- pantry ----------
function snackMenu() {
  const items = Object.entries(PANTRY).filter(([k]) => S.pantry[k] > 0);
  const fresh = Object.keys(FOODS).filter(k => FOODS[k].snack && countFood(k) > 0);
  if (!items.length && !fresh.length) return nope('No snacks at home. Buy some at the 🛒 Supermarket.');
  showModal(`<h2>🍿 What do you want to eat?</h2><div class="grid actions">${items.map(([k, p]) => `<button class="action" onclick="eatSnack('${k}')"><span class="ic">${p.icon}</span><b>${p.name}</b><small>You have ${S.pantry[k]}${p.hot ? ' · needs a stove or microwave' : ''}</small></button>`).join('')}${fresh.map(k => `<button class="action" onclick="eatFresh('${k}')"><span class="ic">${FOODS[k].icon}</span><b>${FOODS[k].name}</b><small>You have ${countFood(k)}</small></button>`).join('')}</div>`,
    [{ label: 'Never mind', cls: 'ghost' }]);
}
function eatSnack(k) {
  const p = PANTRY[k];
  if (p.hot && !hasF('stove') && !has('microwave')) { nope('You need a stove or microwave to heat it up.'); return; }
  closeModal();
  S.pantry[k]--;
  pass(p.hot ? 0.4 : 0.2);
  ateFood(p.food);
  S.needs.fun = clamp(S.needs.fun + p.fun);
  S.needs.health = clamp(S.needs.health + p.health);
  log(`${p.icon} You ate ${p.name.toLowerCase()}.${p.health < 0 ? ' Tasty, but not very healthy.' : ''}`);
  done();
}

// ---------- buying ----------
function homeBuy(id) {
  const adds = { supplies: () => { S.supplies += 20; log('🧻 You bought household supplies: toilet paper, soap and shampoo (20 uses).'); },
    fruit: () => { S.pantry.fruit += 4; log('🍎 You bought fruit (4 snacks).'); },
    chips: () => { S.pantry.chips += 3; log('🥔 You bought chips (3 snacks).'); },
    cereal: () => { S.pantry.cereal += 5; log('🥣 You bought cereal and milk (5 breakfasts).'); },
    pizza: () => { S.pantry.pizza += 2; log('🍕 You bought frozen pizza (2 meals).'); } };
  if (!adds[id]) return false;
  adds[id]();
  if (!hasF('fridge') && ['fruit', 'cereal', 'pizza'].includes(id)) toast('⚠️ You have no fridge. This will go bad overnight!', 'bad');
  return true;
}
function afterBuyHome(it) {
  if (it.id === 'groceries' && !hasF('fridge')) toast('⚠️ No fridge at home: only 2 meals will stay fresh overnight!', 'bad');
  if (it.hang) {
    if (S.walls.length >= WALL_SLOTS[S.home]) { S.inv.prints = (S.inv.prints || []); S.inv.prints.push({ kind: it.hang, q: it.hang === 'famous' ? 99 : 40, seed: Math.random() }); log(`🖼️ Your walls are full, so you put the ${it.name} in storage.`); }
    else { S.walls.push({ kind: it.hang, q: it.hang === 'famous' ? 99 : 40, seed: Math.random() }); log(`🖼️ You hung the ${it.name} on your wall.`); }
    delete S.owned[it.id];
    checkDecor();
  }
}

// ---------- walls & paintings ----------
function hangPainting(i) {
  if (S.walls.length >= WALL_SLOTS[S.home]) return nope(`Your walls are full (${WALL_SLOTS[S.home]} spots). Bigger homes have more wall space!`);
  const q = S.inv.paintings.splice(i, 1)[0];
  S.walls.push({ kind: 'mine', q, seed: Math.random() });
  log('🖼️ You hung up your own painting. It looks great on the wall!', 'good');
  checkDecor();
  done();
}
function hangPrint(i) {
  if (S.walls.length >= WALL_SLOTS[S.home]) return nope('Your walls are full.');
  S.walls.push(S.inv.prints.splice(i, 1)[0]);
  checkDecor(); done();
}
function takeDown(i) {
  const w = S.walls.splice(i, 1)[0];
  if (w.kind === 'mine') S.inv.paintings.push(w.q);
  else { S.inv.prints = S.inv.prints || []; S.inv.prints.push(w); }
  log('🖼️ You took a painting off the wall.');
  done();
}
function paintWalls(col) {
  if (S.home === 'parents' && S.wallColor === col) return;
  if (!spend(30, 'Wall paint')) return;
  pass(3, 'study');
  S.wallColor = col;
  S.needs.fun = clamp(S.needs.fun + 5);
  log('🎨 You painted your walls a new color. Looks fresh!', 'good');
  done();
}
function checkDecor() {
  if (S.walls.length >= 3) unlock('decorator');
  if (cozy() >= 25) unlock('cozy');
}

function homeWelcome() {
  const missing = ESSENTIALS.filter(([f]) => !hasF(f));
  const inc = (HOME_INCLUDES[S.home] || []).length;
  queueModal(`<h2>${home().icon} Welcome to your new home!</h2>
    <p>${inc ? 'It comes with: ' + HOME_INCLUDES[S.home].map(f => ({ toilet: '🚽 toilet', shower: '🚿 shower', fridge: '🧊 fridge', stove: '🍳 stove', mattress: '🛏️ bed', table: '🪑 table', washer: '🧺 washer' }[f])).join(', ') + '.' : 'It\'s completely <b>empty</b>!'}</p>
    ${missing.length ? `<p>You still need to buy:</p><ul class="notes">${missing.map(([, i, n, why]) => `<li>${i} <b>${n}</b>: ${why}</li>`).join('')}</ul><p>Shop for them at the 🛍️ Mall.</p>` : '<p>You already have everything you need!</p>'}
    <p class="lesson">💡 When you move out, you have to buy lots of things your parents had: furniture, appliances, even toilet paper!</p>`);
}

// ---------- the home screen section ----------
function homeSection() {
  const missing = ESSENTIALS.filter(([f]) => !hasF(f));
  const slots = WALL_SLOTS[S.home];
  const pantry = Object.entries(PANTRY).filter(([k]) => S.pantry[k] > 0).map(([k, p]) => `${p.icon} ${S.pantry[k]}`).join(' · ');
  return `<div class="roomwrap"><canvas id="room" aria-label="The inside of your home"></canvas></div>
    <div class="row info">
      <span class="chip">⭐ Coziness: <b>${cozy()}</b></span>
      <span class="chip">${hasF('fridge') ? '🧊' : '⚠️'} Meals: <b>${S.groceries}</b>${pantry ? ' · ' + pantry : ''}</span>
      ${S.home !== 'parents' ? `<span class="chip ${S.supplies < 4 ? 'warn' : ''}">🧻 Supplies: <b>${S.supplies}</b> uses</span>` : ''}
    </div>
    ${missing.length ? `<div class="card needbuy"><b>🛍️ Your home is missing:</b> ${missing.map(([, i, n]) => `${i} ${n}`).join(', ')}. <span class="muted">Buy them at the Mall.</span></div>` : ''}
    <details class="card walls"><summary>🖼️ Your walls (${S.walls.length}/${slots} spots) · 🎨 paint colors</summary>
      <div class="mrows">
        ${S.walls.map((w, i) => mrow('🖼️', w.kind === 'mine' ? `Your painting (quality ${w.q})` : w.kind === 'famous' ? 'Famous painting' : 'Art print', 'On the wall', b('Take down', `takeDown(${i})`, 'ghost'))).join('')}
        ${S.inv.paintings.map((q, i) => mrow('🎨', `Your painting (quality ${q})`, 'In storage · hang it up or sell it at the Mall', b('Hang up', `hangPainting(${i})`, 'primary', S.walls.length >= slots))).join('')}
        ${(S.inv.prints || []).map((w, i) => mrow('🖼️', w.kind === 'famous' ? 'Famous painting' : 'Art print', 'In storage', b('Hang up', `hangPrint(${i})`, 'primary', S.walls.length >= slots))).join('')}
        ${!S.walls.length && !S.inv.paintings.length ? mrow('🎨', 'No paintings yet', 'Buy Art Supplies at the Mall and paint at home, or buy art prints.', '') : ''}
        ${mrow('🖌️', 'Paint your walls ($30 · 3 hrs)', 'Pick a color', `<div class="swatches">${WALL_COLORS.map(c => `<button class="sw ${S.wallColor === c ? 'sel' : ''}" style="background:${c}" onclick="paintWalls('${c}')" aria-label="Paint walls ${c}"></button>`).join('')}</div>`)}
      </div></details>`;
}

// ---------- drawing the room ----------
function artSeed(seed) { let s = Math.floor(seed * 1e9) || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function drawArt(c, x, y, w, h, art) {
  const r = artSeed(art.seed);
  const frame = art.kind === 'famous' ? '#c9a227' : art.kind === 'print' ? '#222' : '#8a5a34';
  const fg = c.createLinearGradient(x - 5, y - 5, x + w + 5, y + h + 5);
  fg.addColorStop(0, tone(frame, 0.3)); fg.addColorStop(0.5, frame); fg.addColorStop(1, tone(frame, -0.35));
  c.fillStyle = fg; c.fillRect(x - 6, y - 6, w + 12, h + 12);
  c.strokeStyle = tone(frame, -0.4, 0.8); c.lineWidth = 1; c.strokeRect(x - 1.5, y - 1.5, w + 3, h + 3);

  if (st.kind === 'grand') { c.fillStyle = trim; c.beginPath(); c.arc(D.x + D.w / 2, D.y - 16, D.w / 2 + 14, Math.PI, 0); c.fill(); const fg = c.createLinearGradient(0, D.y - 90, 0, D.y - 16); fg.addColorStop(0, night ? '#ffd77a' : '#bfe3f5'); fg.addColorStop(1, night ? '#e9a54a' : '#8fc2e0'); c.fillStyle = fg; c.beginPath(); c.arc(D.x + D.w / 2, D.y - 16, D.w / 2, Math.PI, 0); c.fill(); for (let k = 1; k < 6; k++) { c.strokeStyle = trim; c.lineWidth = 3; c.beginPath(); c.moveTo(D.x + D.w / 2, D.y - 16); c.lineTo(D.x + D.w / 2 + Math.cos(Math.PI + k * Math.PI / 6) * D.w / 2, D.y - 16 + Math.sin(Math.PI + k * Math.PI / 6) * D.w / 2); c.stroke(); } }

// the front of the door, drawn once so it can be turned when it opens
function doorFace(st, w0, h, hingeLeft, night) {

  }
  const kx = hingeLeft ? w0 - 16 : 16;
  metal(c, kx - 3, h * 0.5 - 16, 6, 30, 2, '#c9a54a');
  knob(c, kx, h * 0.5 + 4, 5.5, '#d4af37');
  c.fillStyle = '#3a2a10'; c.beginPath(); c.arc(kx, h * 0.5 - 8, 1.8, 0, Math.PI * 2); c.fill();

}

function openDoor() {
  if (doorAnim) return;
  const cv = $('#doorcv');
  if (!cv) { S.doorOpen = true; render(); return; }
  // take a picture of the inside to show through the doorway
  roomPeek = document.createElement('canvas');
  roomPeek.width = RW; roomPeek.height = RH;
  drawRoom(roomPeek, RW);

  const step = now => {

}
function doorSection() {

      <div><b>${st.kind === 'apt' ? `🚪 Apartment ${st.num}` : `🏠 ${home().name}, number ${st.num}`}</b><div class="muted small">You're outside your front door. Open it to go inside.</div></div>

// facade: brick, glass, stone, store, wood, siding · door: swing, double, slide
const ENTRANCE = {
  jobcenter:  { facade: 'glass', wall: '#5c7a99', door: 'slide', doorCol: '#9fc4dd', signBg: '#ffb300', signFg: '#2a1a00', hours: [8, 18], inside: '#f1ece2', keeper: true },
  school:     { facade: 'brick', wall: '#b5523b', door: 'double', doorCol: '#1a3a6b', signBg: '#1a3a6b', signFg: '#ffd23f', hours: [7, 21], inside: '#efe7d2' },
  library:    { facade: 'stone', wall: '#efe3c6', door: 'double', doorCol: '#6b3e26', signBg: '#6d4c41', signFg: '#fff', hours: [8, 21], inside: '#e9dcc0' },
  market:     { facade: 'store', wall: '#f3f3ef', door: 'slide', doorCol: '#bfe3f5', signBg: '#2e7d32', signFg: '#fff', hours: [7, 22], inside: '#f5f7f2', awning: '#2e7d32', keeper: true },
  mall:       { facade: 'store', wall: '#ece1f5', door: 'slide', doorCol: '#bfe3f5', signBg: '#7e57c2', signFg: '#fff', hours: [8, 22], inside: '#f4eefb', awning: '#7e57c2' },
  diner:      { facade: 'store', wall: '#f8bbd0', door: 'swing', doorCol: '#e53935', signBg: '#e53935', signFg: '#ffd23f', hours: [6, 23], inside: '#fff3e6', awning: '#e53935', keeper: true },
  cars:       { facade: 'glass', wall: '#eceff1', door: 'swing', doorCol: '#bfe3f5', signBg: '#1565c0', signFg: '#fff', hours: [8, 20], inside: '#eef2f5', keeper: true },
  bank:       { facade: 'stone', wall: '#e0e0e0', door: 'double', doorCol: '#3e2723', signBg: '#2e7d32', signFg: '#fff', hours: [8, 21], inside: '#efe9dc', keeper: true },
  realestate: { facade: 'siding', wall: '#fff8e1', door: 'swing', doorCol: '#00695c', signBg: '#00897b', signFg: '#fff', hours: [8, 20], inside: '#f4efe4', keeper: true },
  hospital:   { facade: 'glass', wall: '#f5f7fa', door: 'slide', doorCol: '#cfe8fb', signBg: '#e53935', signFg: '#fff', hours: [0, 24], inside: '#eef5f8', keeper: true },
  cityhall:   { facade: 'stone', wall: '#ece4d2', door: 'double', doorCol: '#5d4037', signBg: '#5d4b2a', signFg: '#fff', hours: [8, 20], inside: '#efe7d4' },
  theater:    { facade: 'brick', wall: '#7b1f2e', door: 'double', doorCol: '#3e0f16', signBg: '#ffd23f', signFg: '#7b1f2e', hours: [10, 24], inside: '#5a1a24' },
  office:     { facade: 'glass', wall: '#4b6584', door: 'slide', doorCol: '#9fc4dd', signBg: '#22313f', signFg: '#fff', hours: [6, 20], inside: '#e8edf2' },
  warehouse:  { facade: 'brick', wall: '#90a4ae', door: 'swing', doorCol: '#607d8b', signBg: '#37474f', signFg: '#fff', hours: [5, 20], inside: '#d7dde0' },
};
const ENTRANCE_NAMES = {};   // optional shorter sign text
function entranceOf(pid) { return ENTRANCE[pid] || null; }
function isOpenNow(pid) {
  const st = ENTRANCE[pid]; if (!st) return true;
  const [a, b] = st.hours;
  return S.hour >= a && S.hour < b;
}
function hoursText(pid) {
  const [a, b] = ENTRANCE[pid].hours;
  if (a === 0 && b === 24) return 'Open 24 hours';
  return `Open ${fmtTime(a)} – ${fmtTime(b % 24)}`;
}

function drawEntrance(cv, pid, open = 0) {
  const st = ENTRANCE[pid], p = PLACES[pid];
  const cssW = cv.parentElement.clientWidth;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.height = (cssW * RH / RW) + 'px';
  if (cv.width !== Math.round(cssW * dpr)) { cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssW * dpr * RH / RW); }
  const c = cv.getContext('2d');
  c.setTransform(cv.width / RW, 0, 0, cv.width / RW, 0, 0);
  c.lineCap = 'round';
  const night = S.hour < 6 || S.hour >= 20, rainy = S.weather === 'rainy', openNow = isOpenNow(pid);
  const GROUND = 300;
  const D = st.door === 'swing' ? { x: 446, y: 116, w: 108, h: 184 } : { x: 410, y: 108, w: 180, h: 192 };

  // sky
  const sky = c.createLinearGradient(0, 0, 0, 60);
  if (night) { sky.addColorStop(0, '#0b1633'); sky.addColorStop(1, '#22365f'); } else if (rainy) { sky.addColorStop(0, '#7d8a9b'); sky.addColorStop(1, '#aeb8c4'); } else { sky.addColorStop(0, '#5aa9e6'); sky.addColorStop(1, '#cfe8fa'); }
  c.fillStyle = sky; c.fillRect(0, 0, RW, 40);

  // ---- the wall ----
  const W = st.wall;
  c.fillStyle = W; c.fillRect(0, 24, RW, GROUND - 24);
  if (st.facade === 'brick') {
    for (let y = 24, r = 0; y < GROUND; y += 10, r++) for (let x = (r % 2) * 14; x < RW; x += 28) {
      c.fillStyle = tone(W, ((x * 7 + y * 3) % 5 - 2) * 0.04); c.fillRect(x + 1, y + 1, 26, 8);
    }
    c.fillStyle = 'rgba(0,0,0,.08)'; for (let y = 24; y < GROUND; y += 10) c.fillRect(0, y, RW, 1);
  } else if (st.facade === 'stone') {
    for (let y = 24, r = 0; y < GROUND; y += 24, r++) for (let x = (r % 2) * 40; x < RW; x += 80) { c.fillStyle = tone(W, ((x + y) % 3 - 1) * 0.04); c.fillRect(x + 1, y + 1, 78, 22); }
    [240, 300, 700, 760].forEach(x => { const g = c.createLinearGradient(x - 15, 0, x + 15, 0); g.addColorStop(0, tone(W, -0.15)); g.addColorStop(0.35, tone(W, 0.3)); g.addColorStop(1, tone(W, -0.25)); c.fillStyle = g; c.fillRect(x - 15, 60, 30, GROUND - 60); c.fillStyle = tone(W, 0.15); c.fillRect(x - 21, 54, 42, 10); c.fillRect(x - 21, GROUND - 12, 42, 12); });
    c.fillStyle = tone(W, 0.1); c.beginPath(); c.moveTo(200, 56); c.lineTo(500, 20); c.lineTo(800, 56); c.closePath(); c.fill();
    c.strokeStyle = tone(W, -0.2); c.lineWidth = 2; c.stroke();
  } else if (st.facade === 'glass') {
    const g = c.createLinearGradient(0, 24, RW, GROUND); g.addColorStop(0, night ? '#2b3b52' : '#9fc4dd'); g.addColorStop(0.5, night ? '#3d5574' : '#cfe3f0'); g.addColorStop(1, night ? '#22324a' : '#86afcb');
    c.fillStyle = g; c.fillRect(0, 24, RW, GROUND - 24);
    if (night) { c.fillStyle = 'rgba(255,214,110,.5)'; for (let i = 0; i < 18; i++) if ((i * 7) % 3) c.fillRect((i * 61) % RW, 30 + (i * 37) % 120, 56, 40); }
    c.strokeStyle = tone(W, -0.1); c.lineWidth = 5; for (let x = 0; x < RW; x += 62) { c.beginPath(); c.moveTo(x, 24); c.lineTo(x, GROUND); c.stroke(); }
    for (let y = 24; y < GROUND; y += 46) { c.beginPath(); c.moveTo(0, y); c.lineTo(RW, y); c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.18)'; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(k * 180, 24); c.lineTo(k * 180 + 60, 24); c.lineTo(k * 180 - 40, GROUND); c.lineTo(k * 180 - 100, GROUND); c.fill(); }
  } else if (st.facade === 'wood') {
    for (let y = 24; y < GROUND; y += 16) { const g = c.createLinearGradient(0, y, 0, y + 16); g.addColorStop(0, tone(W, 0.15)); g.addColorStop(0.5, W); g.addColorStop(1, tone(W, -0.3)); c.fillStyle = g; c.fillRect(0, y, RW, 16); }
    for (let i = 0; i < 40; i++) { c.fillStyle = tone(W, -0.35); c.beginPath(); c.arc((i * 131) % RW, 30 + (i * 53) % (GROUND - 40), 2.5, 0, Math.PI * 2); c.fill(); }
  } else if (st.facade === 'siding') {
    for (let y = 24; y < GROUND; y += 13) { c.fillStyle = 'rgba(0,0,0,.09)'; c.fillRect(0, y + 11, RW, 2); c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(0, y, RW, 1.5); }
  } else if (st.facade === 'store') {
    c.fillStyle = tone(W, -0.08); c.fillRect(0, 24, RW, 30);
  }
  // roof line
  c.fillStyle = st.facade === 'wood' ? '#4e342e' : st.facade === 'siding' ? '#5b4636' : tone(W, -0.35); c.fillRect(0, 18, RW, 10);
  c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(0, 28, RW, 5);

  // ---- display windows (left and right of the door) ----
  if (st.facade !== 'glass') {
    [[80, 120, 230, 140], [690, 120, 230, 140]].forEach(([wx, wy, ww, wh], side) => {
      c.fillStyle = tone(W, -0.4); c.fillRect(wx - 7, wy - 7, ww + 14, wh + 14);
      const g = c.createLinearGradient(0, wy, 0, wy + wh);
      if (openNow && night) { g.addColorStop(0, '#fff2cf'); g.addColorStop(1, '#f2cf8a'); } else if (openNow) { g.addColorStop(0, tone(st.inside, -0.02)); g.addColorStop(1, tone(st.inside, -0.15)); } else { g.addColorStop(0, '#3a4450'); g.addColorStop(1, '#1f262e'); }
      c.fillStyle = g; c.fillRect(wx, wy, ww, wh);
      if (openNow) shopWindowStuff(c, pid, wx, wy, ww, wh, side);
      glass(c, wx, wy, ww, wh, 'rgba(255,255,255,0)');
      c.fillStyle = tone(W, -0.25); c.fillRect(wx - 10, wy + wh + 6, ww + 20, 8);
    });
  }
  // awning
  if (st.awning) {
    const y0 = 70;
    for (let k = 0; k < 40; k++) { c.fillStyle = k % 2 ? '#ffffff' : st.awning; c.beginPath(); c.moveTo(k * 26, y0); c.lineTo(k * 26 + 26, y0); c.lineTo(k * 26 + 30, y0 + 30); c.lineTo(k * 26 + 4, y0 + 30); c.fill(); }
    for (let k = 0; k < 40; k++) { c.fillStyle = k % 2 ? '#f1f1f1' : tone(st.awning, -0.15); c.beginPath(); c.arc(k * 26 + 17, y0 + 30, 13, 0, Math.PI); c.fill(); }
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, y0 + 44, RW, 6);
  }
  // ---- the sign ----
  const name = ENTRANCE_NAMES[pid] || p.name.toUpperCase();
  c.font = '900 26px system-ui, sans-serif';
  const sw = Math.min(RW - 120, c.measureText(name).width + 110);
  const sy = st.awning ? 30 : 48;
  c.fillStyle = 'rgba(0,0,0,.25)'; rrect(c, RW / 2 - sw / 2 + 5, sy + 5, sw, 40, 8); c.fill();
  c.fillStyle = st.signBg; rrect(c, RW / 2 - sw / 2, sy, sw, 40, 8); c.fill();
  c.strokeStyle = tone(st.signBg, 0.3); c.lineWidth = 2; c.stroke();
  txt(c, `${p.icon} ${name}`, RW / 2, sy + 21, st.signFg, 24, 900);
  if (night && openNow) { c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(255,240,200,.12)'; rrect(c, RW / 2 - sw / 2 - 10, sy - 10, sw + 20, 60, 14); c.fill(); c.restore(); }

  // ---- sidewalk ----
  const sg = c.createLinearGradient(0, GROUND, 0, RH); sg.addColorStop(0, '#bdb7aa'); sg.addColorStop(1, '#d6d0c3');
  c.fillStyle = sg; c.fillRect(0, GROUND, RW, RH - GROUND);
  c.strokeStyle = 'rgba(90,80,70,.3)'; c.lineWidth = 1;
  for (let x = -200; x < RW + 200; x += 90) { c.beginPath(); c.moveTo(RW / 2 + (x - RW / 2) * 0.7, GROUND); c.lineTo(x, RH); c.stroke(); }
  for (let y = GROUND + 18; y < RH; y += 22) { c.beginPath(); c.moveTo(0, y); c.lineTo(RW, y); c.stroke(); }
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, GROUND, RW, 4);
  // planters
  [[D.x - 90, GROUND - 2], [D.x + D.w + 46, GROUND - 2]].forEach(([px, py]) => {
    box3d(c, px, py - 34, 44, 34, 0.02, '#8d8478', 'solid');
    [[-10, 18], [0, 22], [10, 18]].forEach(([dx, r]) => { const g = c.createRadialGradient(px + 22 + dx - 4, py - 50, 2, px + 22 + dx, py - 46, r); g.addColorStop(0, '#6fbf5a'); g.addColorStop(1, '#2f7d32'); c.fillStyle = g; c.beginPath(); c.arc(px + 22 + dx, py - 44 + (r < 20 ? 4 : 0), r * 0.75, 0, Math.PI * 2); c.fill(); });
  });

  // ---- doorway: inside peek ----
  if (open > 0) {
    c.save(); c.beginPath(); c.rect(D.x, D.y, D.w, D.h); c.clip();
    const ig = c.createLinearGradient(0, D.y, 0, D.y + D.h); ig.addColorStop(0, st.inside); ig.addColorStop(0.7, tone(st.inside, -0.08)); ig.addColorStop(0.7, '#c9c2b5'); ig.addColorStop(1, '#a99f8e');
    c.fillStyle = ig; c.fillRect(D.x, D.y, D.w, D.h);
    // a counter and someone who works there
    if (st.keeper) { box3d(c, D.x + D.w * 0.15, D.y + D.h * 0.55, D.w * 0.7, D.h * 0.18, 0, '#8a5e3c', 'wood', 3); drawPerson(c, D.x + D.w * 0.5, D.y + D.h * 0.6, 1.6, { skin: '#e0a878', hair: '#2a1c14', style: 'short', shirt: st.signBg, pants: '#24395e' }); box3d(c, D.x + D.w * 0.15, D.y + D.h * 0.58, D.w * 0.7, D.h * 0.16, 0, '#8a5e3c', 'wood', 3); }
    else {
      // shelves of books, rows of seats, or tables
      for (let k = 0; k < 3; k++) {
        const sx = D.x + 8 + k * (D.w / 3), sw2 = D.w / 3 - 14;
        box3d(c, sx, D.y + D.h * 0.25, sw2, D.h * 0.45, 0, '#6e4527', 'wood', k);
        for (let r2 = 0; r2 < 3; r2++) for (let bx = sx + 3; bx < sx + sw2 - 4; bx += 4.5) book(c, bx, D.y + D.h * 0.27 + r2 * D.h * 0.15, 4, D.h * 0.12, ['#9e2a2b', '#2b5f9e', '#2e7d4f', '#c9861a', '#6b3fa0'][Math.floor((bx + r2 * 7) % 5)]);
      }
    }
    const lg = c.createRadialGradient(D.x + D.w / 2, D.y, 5, D.x + D.w / 2, D.y + 40, D.w); lg.addColorStop(0, 'rgba(255,250,220,.5)'); lg.addColorStop(1, 'rgba(255,250,220,0)');
    c.fillStyle = lg; c.fillRect(D.x, D.y, D.w, D.h);
    c.fillStyle = `rgba(0,0,0,${0.35 * (1 - open)})`; c.fillRect(D.x, D.y, D.w, D.h);
    c.restore();
  }
  // ---- door frame ----
  const frame = st.facade === 'glass' || st.door === 'slide' ? '#7d8791' : st.facade === 'stone' ? '#ddd3bf' : st.facade === 'wood' ? '#5d4037' : '#f4f1ea';
  box3d(c, D.x - 12, D.y - 14, D.w + 24, 14, 0, frame, st.door === 'slide' ? 'metal' : 'solid');
  box3d(c, D.x - 12, D.y, 12, D.h, 0, frame, st.door === 'slide' ? 'metal' : 'solid');
  box3d(c, D.x + D.w, D.y, 12, D.h, 0, frame, st.door === 'slide' ? 'metal' : 'solid');
  if (!(st.door !== 'slide' && open > 0)) {}  // nothing
  // ---- doors ----
  const glassDoor = st.door === 'slide' || st.facade === 'glass' || st.facade === 'store';
  if (st.door === 'slide') {
    const half = D.w / 2, shift = half * 0.92 * open;
    [[D.x - shift, -1], [D.x + half + shift, 1]].forEach(([x]) => {
      c.save(); c.beginPath(); c.rect(D.x - 2, D.y, D.w + 4, D.h); c.clip();
      metal(c, x, D.y, half, D.h, 1, '#9aa3aa');
      c.fillStyle = openNow ? 'rgba(190,225,245,.55)' : 'rgba(40,55,70,.75)'; c.fillRect(x + 6, D.y + 6, half - 12, D.h - 12);
      glass(c, x + 6, D.y + 6, half - 12, D.h - 12, 'rgba(255,255,255,0)');
      c.restore();
    });
    if (open < 0.1) { c.fillStyle = '#ffffff'; rrect(c, D.x + D.w / 2 - 40, D.y + D.h * 0.55, 80, 16, 4); c.fill(); txt(c, 'AUTOMATIC DOOR', D.x + D.w / 2, D.y + D.h * 0.55 + 8.5, '#2b5f9e', 8, 800); }
  } else {
    const panels = st.door === 'double' ? [[D.x, D.w / 2, true], [D.x + D.w / 2, D.w / 2, false]] : [[D.x, D.w, true]];
    panels.forEach(([x0, w0, left]) => swingPanel(c, placeDoorFace(st, w0, D.h, left, glassDoor, openNow), x0, D.y, w0, D.h, left, open, st.doorCol));
  }
  // OPEN / CLOSED sign and hours
  if (open < 0.2) {
    const tx = st.door === 'slide' ? D.x + D.w / 2 : D.x + D.w / 2;
    c.strokeStyle = '#555'; c.lineWidth = 1; c.beginPath(); c.moveTo(tx - 16, D.y + 34); c.lineTo(tx, D.y + 24); c.lineTo(tx + 16, D.y + 34); c.stroke();
    c.fillStyle = openNow ? '#2e7d32' : '#c62828'; rrect(c, tx - 30, D.y + 34, 60, 22, 4); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 1.5; rrect(c, tx - 27, D.y + 37, 54, 16, 3); c.stroke();
    txt(c, openNow ? 'OPEN' : 'CLOSED', tx, D.y + 45.5, '#fff', 11, 900);
  }
  c.fillStyle = '#f7f4ec'; rrect(c, D.x + D.w + 20, D.y + 60, 72, 44, 4); c.fill(); c.strokeStyle = 'rgba(0,0,0,.2)'; c.lineWidth = 1; c.stroke();
  const [ha, hb] = st.hours;
  txt(c, 'HOURS', D.x + D.w + 56, D.y + 71, '#555', 8, 900);
  txt(c, ha === 0 && hb === 24 ? 'Always open' : `${fmtTime(ha)}`, D.x + D.w + 56, D.y + 83, '#222', 9, 800);
  if (!(ha === 0 && hb === 24)) txt(c, `to ${fmtTime(hb % 24)}`, D.x + D.w + 56, D.y + 95, '#222', 9, 800);
  // mat
  c.fillStyle = '#5b5b5b'; c.beginPath(); c.moveTo(D.x - 4, GROUND + 4); c.lineTo(D.x + D.w + 4, GROUND + 4); c.lineTo(D.x + D.w + 14, GROUND + 20); c.lineTo(D.x - 14, GROUND + 20); c.fill();
  txt(c, 'WELCOME', D.x + D.w / 2, GROUND + 12.5, 'rgba(255,255,255,.55)', 10, 900);
  // you
  if (open < 0.95) drawPerson(c, D.x - 160, GROUND + 56, 2.4, S.look);
  // light & weather
  if (night) { c.fillStyle = 'rgba(12,18,45,.35)'; c.fillRect(0, 0, RW, RH); if (openNow) { c.save(); c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(RW / 2, D.y + D.h, 10, RW / 2, D.y + D.h, 260); g.addColorStop(0, 'rgba(255,220,150,.25)'); g.addColorStop(1, 'rgba(255,220,150,0)'); c.fillStyle = g; c.fillRect(0, 0, RW, RH); c.restore(); } }
  else if (rainy) { c.fillStyle = 'rgba(60,70,90,.15)'; c.fillRect(0, 0, RW, RH); c.strokeStyle = 'rgba(220,230,255,.5)'; c.lineWidth = 1.2; c.beginPath(); for (let i = 0; i < 120; i++) { const x = (i * 83) % RW, y = (i * 53 + performance.now() * 0.3) % RH; c.moveTo(x, y); c.lineTo(x - 3, y + 10); } c.stroke(); }
  const vg = c.createRadialGradient(RW / 2, RH / 2, RH * 0.4, RW / 2, RH / 2, RW * 0.62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.22)');
  c.fillStyle = vg; c.fillRect(0, 0, RW, RH);
}

// things you can see through the shop window
function shopWindowStuff(c, pid, x, y, w, h, side) {
  const r = seeded(pid.length * 31 + side);
  const shelf = (yy) => box3d(c, x + 8, yy, w - 16, 5, 0.02, '#b08a5a', 'wood', 2);
  if (['market', 'mall', 'diner', 'icecream', 'bakery', 'generalstore', 'gearshop', 'fishmarket', 'pottery', 'cocoa', 'pancake'].includes(pid)) {
    for (let s = 0; s < 3; s++) {
      const yy = y + 36 + s * 40;
      shelf(yy);
      for (let k = 0; k < 9; k++) {
        const col = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#f06292', '#8d6e63'][Math.floor(r() * 8)];
        const bx = x + 14 + k * ((w - 28) / 9), bh = 10 + r() * 16;
        if (r() < 0.5) box3d(c, bx, yy - bh, (w - 28) / 9 - 4, bh, 0.01, col, 'solid'); else { const g = c.createRadialGradient(bx + 5, yy - 9, 1, bx + 7, yy - 7, 8); g.addColorStop(0, tone(col, 0.4)); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(bx + 8, yy - 7, 7, 0, Math.PI * 2); c.fill(); }
      }
    }
  } else if (['library', 'school'].includes(pid)) {
    for (let s = 0; s < 3; s++) { const yy = y + 40 + s * 40; shelf(yy); for (let bx = x + 12; bx < x + w - 14; bx += 6) book(c, bx, yy - 22 - r() * 8, 5, 22 + r() * 8 - 0.1, ['#9e2a2b', '#2b5f9e', '#2e7d4f', '#c9861a', '#6b3fa0'][Math.floor(r() * 5)]); }
  } else {
    // people inside
    for (let k = 0; k < 2; k++) drawPerson(c, x + 50 + k * 110 + r() * 20, y + h - 6, 1.6, randomLook(r));
    box3d(c, x + 20, y + h - 40, w - 40, 12, 0.03, '#8a5e3c', 'wood', 4);
  }
}

// a hinged door that swings toward you
function swingPanel(c, face, x0, y0, w0, h, hingeLeft, open, col) {
  const R = 2, ang = open * Math.PI * 0.46;

(function townHouses() {

    [B.OCEAN, B.LAKE, B.SAND].includes(biome(box[0] + box[2] / 2, box[1] + box[3])) || Math.abs(box[0] + box[2] / 2 - riverX(box[1] + box[3] / 2)) < 90;
  // remove old village houses that are in the way of new buildings
  for (let i = VHOUSES.length - 1; i >= 0; i--) { const h = VHOUSES[i]; if (Object.values(PLACES).some(p => p.shop && overlap([h.x, h.y, h.w, h.h], p.r, 10))) VHOUSES.splice(i, 1); }
  const add = (x, y) => {
    const box = [x, y, 84, 66];
    if (bad(box)) return;
    VHOUSES.push({ x, y, w: 84, h: 66, wall: ['#f7d794', '#a7d8f0', '#f8c6c6', '#d6f0b5', '#e4d4f7', '#fde2b8', '#f2f2f2', '#c8e6c9'][Math.floor(r() * 8)], roof: ['#c0392b', '#34495e', '#8e44ad', '#2c7a4b', '#7f5539', '#b03a2e'][Math.floor(r() * 6)], seed: r() });
  };
  const street = (x0, x1, y) => { for (let x = x0; x < x1; x += 100) { add(x, y - 22 - 66 - 6); add(x, y + 26); } };
  street(3460, 5050, 2900);
  street(-3340, -1660, 1500);
  street(-2440, -1160, -1850);
  street(3600, 4300, -1600);
  for (let y = 1600; y < 2850; y += 110) { add(4300 - 22 - 84 - 6, y); add(4300 + 26, y); }
  for (let y = 520; y < 1450; y += 120) { add(-3000 - 22 - 84 - 6, y); add(-3000 + 26, y); }
})();

function viewTownPlace(id) {

}

const baseOf = p => (PET_TYPES[p.kind || p] || PET_TYPES.dog).base;
const PET_NAMES = ['Max', 'Luna', 'Bella', 'Charlie', 'Coco', 'Biscuit', 'Peanut', 'Pepper', 'Ziggy', 'Mochi', 'Rocky', 'Daisy', 'Nugget', 'Sunny', 'Pickles', 'Oreo', 'Waffles', 'Pumpkin', 'Shadow', 'Noodle'];
const MAX_PETS = 3;

function ensurePetState() { if (!S.pets) S.pets = []; if (S.petFood === undefined) S.petFood = 0; }
// Pet rules, like real landlords
function petAllowed(kind, homeId = S.home) {
  const t = PET_TYPES[kind], b = t.base;
  if (['parents', 'small', 'family', 'mansion'].includes(homeId)) return true;
  if (homeId === 'onebed') return b !== 'dog' || t.size === 'small';
  if (homeId === 'studio') return b !== 'dog' && !t.loud;
  if (homeId === 'shared') return ['small', 'fish', 'reptile'].includes(b) || (b === 'bird' && !t.loud);
  return true;
}
function petRuleText(homeId = S.home) {
  return { onebed: 'Only small dogs allowed.', studio: 'No dogs and no loud birds.', shared: 'Only small animals, fish, reptiles and quiet birds.' }[homeId] || 'All pets allowed!';
}
function petsOkFor(homeId) {
  const bad = (S.pets || []).filter(p => !petAllowed(p.kind, homeId));
  if (bad.length) { nope(`🐾 ${HOMES[homeId].name} doesn't allow your ${PET_TYPES[bad[0].kind].name}. ${petRuleText(homeId)} ${bad[0].name} needs a home where pets are allowed!`); return false; }
  return true;
}

// ---------- time passing ----------
function petTick(h) {
  (S.pets || []).forEach(p => {
    const t = PET_TYPES[p.kind], b = t.base;
    p.food = clamp(p.food - 2 * t.eats * h * (b === 'fish' ? 1.6 : 1));
    p.happy = clamp(p.happy - (t.walks ? (t.energetic ? 2 : 1.5) : 1) * h);
    p.clean = clamp(p.clean - (b === 'fish' || b === 'reptile' ? 0.5 : 0.8) * h);
    if (p.food <= 0) p.health -= 2 * h; else if (p.clean < 15) p.health -= 0.5 * h; else p.health += 0.3 * h;
    p.health = clamp(p.health);
  });
  if (atHome() && S.pets && S.pets.length) S.needs.fun = clamp(S.needs.fun + S.pets.filter(p => p.happy > 50).length * 0.4 * h);
}
function petNewDay() {
  ensurePetState();
  S.pets.forEach(p => {
    p.age = (p.age || 0) + 1;
    if (PET_TYPES[p.kind].walks) {
      if (!p.walked) { p.happy = clamp(p.happy - (PET_TYPES[p.kind].energetic ? 25 : 15)); if (Math.random() < 0.4) { log(`💩 ${p.name} had an accident on the floor because nobody took them for a walk!`, 'bad'); S.needs.fun = clamp(S.needs.fun - 8); } }
      p.walked = false;
    }
    p.happyStreak = p.happy > 70 ? (p.happyStreak || 0) + 1 : 0;
    if (p.happyStreak >= 7) unlock('happy_pet');
    if (p.health <= 0) {
      const bill = 250;
      charge(bill, `Emergency vet for ${p.name}`);
      p.health = 60; p.food = 60; p.neglect = (p.neglect || 0) + 1;
      queueModal(`<h2>🚑 ${esc(p.name)} Got Very Sick</h2><p>${esc(p.name)} wasn't taken care of and got very sick. The emergency vet made ${esc(p.name)} better.</p><p>Bill: <b>${money(bill)}</b></p><p class="lesson">💡 Pets depend on you for food, water, a clean home and love — every single day.</p>`);
    }
  });
  const gone = S.pets.filter(p => (p.neglect || 0) >= 3);
  gone.forEach(p => {
    queueModal(`<h2>🏠 ${esc(p.name)} Found a New Home</h2><p>${esc(p.name)} got sick too many times, so the animal shelter took ${esc(p.name)} to a family who can take better care of them.</p><p class="lesson">💡 Having a pet is a big responsibility. Before you get one, make sure you have the time and money to care for it.</p>`);
    log(`😢 The animal shelter gave ${p.name} a new home.`, 'bad');
  });
  S.pets = S.pets.filter(p => (p.neglect || 0) < 3);
  const kinds = new Set((S.pets || []).map(p => baseOf(p)));
  if (kinds.size >= 3) unlock('zoo_keeper');
}

// ---------- getting a pet ----------
function getPet(kind, adopt) {
  ensurePetState();
  const t = PET_TYPES[kind];
  if (S.pets.length >= MAX_PETS) return nope(`You can have up to ${MAX_PETS} pets. That's plenty to take care of!`);
  if (!petAllowed(kind)) return nope(`🏢 Your ${home().name} doesn't allow a ${t.name}. ${petRuleText()}`);
  const price = adopt ? t.adopt : t.price;
  const suggest = PET_NAMES[Math.floor(Math.random() * PET_NAMES.length)];
  showModal(`<h2>${t.icon} ${adopt ? 'Adopt' : 'Buy'} a ${t.name}</h2>
    <p>${t.about}</p>
    <p>${adopt ? `Adoption fee: <b>${money(price)}</b>. This pet is waiting at the shelter for a loving home! ❤️` : `Price: <b>${money(price)}</b>`}</p>
    <label class="field">What will you name your ${t.name.toLowerCase()}?<input id="petname" maxlength="14" value="${suggest}"></label>
    <p class="lesson">💡 Pets need food every day. Buy pet food at the pet shop. ${t.walks ? `Dogs need a walk every day${t.energetic ? ' — and huskies need extra exercise' : ''}!` : ''}</p>`,
    [{ label: 'Not now', cls: 'ghost' }, { label: `${t.icon} ${adopt ? 'Adopt' : 'Buy'} for ${money(price)}`, cls: 'primary', keepOpen: true, fn: () => {
      const name = ($('#petname').value || '').trim();
      if (!name) { nope('Give your pet a name!'); return; }
      closeModal();
      if (!spend(price, adopt ? `Adopted ${name}` : `Bought ${name} the ${t.name}`)) return;
      const r = Math.random();
      S.pets.push({ kind, name, color: t.colors[Math.floor(r * t.colors.length)], food: 80, happy: 90, clean: 100, health: 100, age: adopt ? 400 + Math.floor(r * 900) : 60, walked: true, id: Date.now() });
      unlock('pet_owner');
      log(`${t.icon} Welcome home, ${name}! You ${adopt ? 'adopted' : 'bought'} a ${t.name}.`, 'good');
      queueModal(`<h2>${t.icon} Meet ${esc(name)}!</h2><p>${esc(name)} is your new ${t.name}! Take care of ${esc(name)} from the 🐾 Pets section on your Home screen.</p><p class="muted">Fun fact: ${t.about}</p><ul class="notes"><li>🍖 Feed twice a day</li><li>🎾 Play${['fish', 'reptile'].includes(t.base) ? '' : ' and cuddle'} so they're happy</li><li>🧽 Keep their home clean</li>${t.walks ? '<li>🦮 Walk every day</li>' : ''}<li>🩺 Visit the vet for checkups</li></ul>`);
      done();
    } }]);
}

// ---------- caring ----------
function petAct(i, what) {
  const p = S.pets[i]; if (!p) return;
  const t = PET_TYPES[p.kind], b = t.base;
  if (!atHome()) return nope('You can only do that at home.');
  if (what === 'feed') {
    if (S.petFood < t.eats) return nope('You\'re out of pet food! Buy some at Happy Paws Pet Shop.');
    S.petFood = Math.max(0, S.petFood - t.eats); pass(0.1); p.food = clamp(p.food + 50); p.happy = clamp(p.happy + 4);
    log(`🍖 You fed ${p.name}. ${{ dog: 'Their tail wagged like crazy!', cat: 'They purred.', fish: 'Blub blub!', bird: 'Tweet tweet!', reptile: t.snake ? 'Snakes eat slowly...' : 'Crunch! They love crickets.', small: 'Munch munch!' }[b]}`);
  } else if (what === 'play') {
    if (S.needs.energy < 10) return nope('You\'re too tired to play.');
    pass(0.5, 'relax'); p.happy = clamp(p.happy + 28); S.needs.fun = clamp(S.needs.fun + 8); addSkill('animal', 1);
    const msg = {
      dog: t.energetic ? `❄️ You and ${p.name} raced around the yard. Huskies never get tired!` : t.curly ? `🐩 ${p.name} learned a new trick: spin around!` : `🎾 You played fetch with ${p.name}!`,
      cat: `🧶 ${p.name} chased a string around the room!`,
      bird: t.loud ? `🦜 You taught ${p.name} to say "Hello!"` : `🎶 ${p.name} sang a song with you!`,
      fish: t.axolotl ? `🦎 ${p.name} smiled and wiggled its frilly gills at you.` : `🐠 You watched ${p.name} swim around the castle.`,
      reptile: t.snake ? `🐍 ${p.name} gently wrapped around your arm. Smooth, not slimy!` : t.water ? `🐢 ${p.name} slowly explored the floor.` : `🦎 ${p.name} sat on your shoulder${p.kind === 'beardie' ? ' and waved hello' : ''}!`,
      small: p.kind === 'hedgehog' ? `🦔 ${p.name} uncurled and sniffed your hand.` : p.kind === 'ferret' ? `🦦 ${p.name} did the happy ferret dance!` : p.kind === 'chinchilla' ? `🐭 ${p.name} took a dust bath and bounced around.` : `🐾 ${p.name} ran through a tunnel!`,
    }[b];
    log(msg);
  } else if (what === 'cuddle') {
    if (b === 'fish' || b === 'reptile') return nope(`${p.name} isn't really a cuddly pet!`);
    if (p.kind === 'hedgehog') { pass(0.1); p.happy = clamp(p.happy + 6); log(`🦔 You gently held ${p.name}. Prickly!`); return done(); }
    pass(0.1, 'relax'); p.happy = clamp(p.happy + 10); S.needs.fun = clamp(S.needs.fun + 5);
    log(`🤗 You cuddled ${p.name}. So soft!`);
  } else if (what === 'clean') {
    pass(0.25); p.clean = 100; S.handsDirty = true; S.needs.hygiene = clamp(S.needs.hygiene - 4);
    log({ dog: `🛁 You gave ${p.name} a bath and swept up the fur.`, cat: `🧹 You cleaned ${p.name}'s litter box. (Wash your hands!)` }[b] || `🧽 You cleaned ${p.name}'s ${b === 'fish' || b === 'reptile' ? 'tank' : 'cage'}. (Wash your hands!)`);
  } else if (what === 'walk') {
    if (!t.walks) return;
    if (S.needs.energy < 15) return nope('You\'re too tired for a walk.');
    if (p.walked) return nope(`${p.name} already went for a walk today. Thanks!`);
    const long = t.energetic;
    pass(long ? 1.5 : 1, 'sport'); p.walked = true; p.happy = clamp(p.happy + 30); addSkill('fit', long ? 2.5 : 1.5); addSkill('animal', 1); S.needs.fun = clamp(S.needs.fun + 8);
    log(long ? `🦮 You took ${p.name} on a long run. Huskies LOVE running!` : t.tiny ? `🦮 ${p.name} took 1,000 tiny steps around the block.` : `🦮 You walked ${p.name} around the block. ${p.name} sniffed every tree!`, 'good');
  }
  done();
}
function petBuy(what) {
  const items = { food: [15, 'Pet Food (14 meals)', () => { S.petFood += 14; }], bigfood: [40, 'Big Bag of Pet Food (45 meals)', () => { S.petFood += 45; }], toy: [10, 'Pet Toy', () => { (S.pets || []).forEach(p => p.happy = clamp(p.happy + 20)); }] };
  const [price, label, fn] = items[what];
  if (!spend(price, label)) return;
  fn();
  log(what === 'toy' ? '🎾 You bought a squeaky toy. Your pets love it!' : `🍖 You bought ${label.toLowerCase()}. You have ${S.petFood} meals of pet food.`);
  done();
}
function vetCheck(i, what) {
  const p = S.pets[i]; if (!p) return;
  const price = { checkup: 60, groom: 35, shots: 45 }[what];
  if (!spend(price, `Vet: ${p.name}`)) return;
  pass(1);
  if (what === 'checkup') { p.health = 100; p.neglect = Math.max(0, (p.neglect || 0) - 1); log(`🩺 The vet checked ${p.name} from nose to tail. Healthy and happy!`, 'good'); }
  if (what === 'groom') { p.clean = 100; p.happy = clamp(p.happy + 10); log(`✂️ ${p.name} got cleaned up and looks great!`); }
  if (what === 'shots') { p.health = clamp(p.health + 20); p.vaccinated = true; log(`💉 ${p.name} got vaccines to stay healthy. Brave pet!`); }
  addSkill('animal', 0.5);
  done();
}

// ---------- screens ----------
function petBar(v, label) { const cls = v < 25 ? 'low' : v < 50 ? 'mid' : 'ok'; return `<div class="pbar"><span>${label}</span><div class="bar small"><div class="fill ${cls}" style="width:${v}%"></div></div></div>`; }
function petsSection() {
  ensurePetState();

  return `<div class="card pets"><h3>🐾 Your Pets <span class="muted small">· 🍖 ${S.petFood} meals of pet food</span></h3>
    <div class="grid petgrid">${S.pets.map((p, i) => { const t = PET_TYPES[p.kind], b = t.base; return `<div class="petcard">
      <div class="jt"><b>${t.icon} ${esc(p.name)}</b><span class="muted small">${p.age > 365 ? Math.floor(p.age / 365) + ' yr' : p.age + ' days'}</span></div>
      <div class="muted small">${t.name}</div>
      ${petBar(p.food, '🍖 Food')}${petBar(p.happy, '😊 Happy')}${petBar(p.clean, '🧽 Clean')}${petBar(p.health, '❤️ Health')}
      <div class="row">
        <button class="btn sm primary" onclick="petAct(${i},'feed')">Feed</button>
        <button class="btn sm primary" onclick="petAct(${i},'play')">Play</button>
        ${b !== 'fish' && b !== 'reptile' ? `<button class="btn sm ghost" onclick="petAct(${i},'cuddle')">Cuddle</button>` : ''}
        <button class="btn sm ghost" onclick="petAct(${i},'clean')">Clean</button>
        ${t.walks ? `<button class="btn sm ${p.walked ? 'ghost' : 'primary'}" onclick="petAct(${i},'walk')">${p.walked ? '✅ Walked' : '🦮 Walk'}</button>` : ''}
      </div></div>`; }).join('')}</div></div>`;
}
function viewPetShop() {
  ensurePetState();
  const card = (k, adopt) => { const t = PET_TYPES[k]; const ok = petAllowed(k); return `<div class="card item petshopcard">
    <canvas class="petpic" data-kind="${k}" width="160" height="90" aria-label="${t.name}"></canvas>
    <div class="jt"><b>${t.icon} ${t.name}</b><span class="pay">${money(adopt ? t.adopt : t.price)}</span></div>
    <p class="muted small">${adopt ? 'A grown-up pet from the shelter who needs a home. ' : ''}${t.about}</p>

  return `<p>Buy a pet, or adopt one from the shelter for much less. You have <b>${S.pets.length}/${MAX_PETS}</b> pets. <span class="muted">Your home: ${petRuleText()}</span></p>
    <h3>🛒 Pet Supplies</h3>
    <div class="grid shop">
      <div class="card item"><div class="jt"><b>🍖 Pet Food (14 meals)</b><span class="pay">$15</span></div><p class="muted small">Every pet needs to eat about twice a day. You have ${S.petFood} meals.</p><button class="btn primary sm" onclick="petBuy('food')">Buy</button></div>
      <div class="card item"><div class="jt"><b>🍖 Big Bag (45 meals)</b><span class="pay">$40</span></div><p class="muted small">Buying more at once costs less per meal!</p><button class="btn primary sm" onclick="petBuy('bigfood')">Buy</button></div>
      <div class="card item"><div class="jt"><b>🎾 Squeaky Toy</b><span class="pay">$10</span></div><p class="muted small">Makes all your pets happier.</p><button class="btn primary sm" onclick="petBuy('toy')">Buy</button></div>
    </div>
    <h3>❤️ Adoption Center</h3><div class="grid shop">${['dog', 'cat'].map(k => card(k, true)).join('')}</div>
    ${PET_GROUPS.map(([g, title]) => `<h3>${title}</h3><div class="grid shop">${Object.keys(PET_TYPES).filter(k => PET_TYPES[k].base === g).map(k => card(k, false)).join('')}</div>`).join('')}
    <p class="lesson">💡 Pure-bred dogs and fancy cats cost a lot. Shelter pets cost much less and need homes too!</p>`;
}
function drawShopPics() {
  document.querySelectorAll('canvas.petpic').forEach(cv => {

  if (p.talkedDay !== S.day) { p.talkedDay = S.day; p.topics = [topic]; p.rel = clamp(p.rel + 2); S.needs.fun = clamp(S.needs.fun + 4); }
  if (p.rel >= 80) unlock('goodneighbor');
  const hearts = '❤️'.repeat(Math.max(1, Math.round(p.rel / 20)));
  const choices = [['hello', '👋 Say hi'], ['weather', '🌦️ The weather'], ['news', '📰 What\'s new?'], ['you', '🙂 Talk about you'], ['advice', '💡 Ask for advice'], ['help', T.help[1]]];
  showModal(`<div class="talk"><img class="avatar" src="${avatarURL(p.look, 96)}" alt="${esc(p.name)}">
    <div><b>${esc(p.name)}</b> <span class="muted small">${T.job} · ${hearts}</span><div class="bubble">${esc(line)}</div></div></div>

    <div class="row">${choices.map(([k, l]) => `<button class="btn sm ${k === topic ? 'primary' : 'ghost'}" onclick="talkNeighbor(${i}, '${k}')">${l}</button>`).join('')}</div>`,
    [{ label: '👋 Say goodbye', cls: 'ghost', fn: () => done() }]);
