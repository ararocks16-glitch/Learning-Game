<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Big Game of Life</title>
  <style>
:root {
  --bg: #eef6ff;
  --bg2: #ffffff;
  --ink: #1d2b3a;
  --muted: #64748b;
  --line: #dbe4ee;
  --primary: #2f80ed;
  --primary-ink: #fff;
  --good: #1f9d55;
  --bad: #d64545;
  --warn: #f2a516;
  --skill: #8b5cf6;
  --shadow: 0 2px 8px rgba(30, 60, 100, .08);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a2233; --bg2: #24304a; --ink: #e8eef7; --muted: #9fb0c8; --line: #34425f;
    --shadow: 0 2px 8px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a2233; --bg2: #24304a; --ink: #e8eef7; --muted: #9fb0c8; --line: #34425f;
  --shadow: 0 2px 8px rgba(0, 0, 0, .3); color-scheme: dark;
}
body.night {
  --bg: #1a2233;
  --bg2: #24304a;
  --ink: #e8eef7;
  --muted: #9fb0c8;
  --line: #34425f;
  --shadow: 0 2px 8px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  transition: background .6s, color .6s;
  font-size: 15px;
}
.hidden { display: none !important; }
h1, h2, h3 { margin: .6em 0 .4em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: .4em 0; line-height: 1.45; }
a { color: var(--primary); cursor: pointer; text-decoration: underline; }
.muted { color: var(--muted); font-weight: normal; }
.small { font-size: .85rem; }
.neg { color: var(--bad) !important; }
.big { font-size: 1.5rem; font-weight: 700; }

#app { max-width: 1280px; margin: 0 auto; padding-block: 12px 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* HUD */
#hud {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  background: var(--bg2); border-radius: var(--radius); padding: 10px 16px; box-shadow: var(--shadow);
}
.who { display: flex; gap: 10px; align-items: center; }
.avatar { font-size: 2.2rem; }
.clock { text-align: center; }
.cash { text-align: right; }
.cash .big { color: var(--good); }

/* needs */
#needs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 10px 0; }
.need { background: var(--bg2); border-radius: 10px; padding: 6px 10px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; font-size: .85rem; }
.need .bar { grid-column: 1 / -1; grid-row: 2; }
.need .num { grid-row: 1; grid-column: 2; font-weight: 700; }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar.small { height: 6px; margin: 4px 0; }
.fill { height: 100%; border-radius: 6px; transition: width .4s; }
.fill.ok { background: var(--good); }
.fill.mid { background: var(--warn); }
.fill.low { background: var(--bad); }
.fill.skill { background: var(--skill); }

#warnings { display: flex; flex-wrap: wrap; gap: 6px; min-height: 4px; }
.chip { display: inline-block; background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
.chip.warn { background: #fff4dd; border-color: #f5c66b; color: #7a4d00; }
.chip.good { background: #e3f7ea; border-color: #9fdcb4; color: #17623a; }

/* tabs */
#tabs { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0; padding-bottom: 2px; }
.tab {
  flex: 1 0 auto; border: none; background: var(--bg2); color: var(--ink); border-radius: 12px; padding: 8px 12px;
  font-size: 1.2rem; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px;
}
.tab span { font-size: .75rem; font-weight: 600; }
.tab.active { background: var(--primary); color: var(--primary-ink); }

.main { display: grid; grid-template-columns: 1fr 320px; gap: 14px; align-items: start; }
#view { min-width: 0; }
.left { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
#mapwrap { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: #7cc46a; line-height: 0; border: 3px solid var(--bg2); }
#map { width: 100%; display: block; touch-action: none; cursor: grab; }
#tabs { margin: 0; }
.tab { position: relative; }
.tab.here { outline: 2px solid var(--good); outline-offset: -2px; }
.tab i { position: absolute; top: 1px; right: 3px; font-style: normal; font-size: .7rem; }
.tab.personal { background: var(--line); }
.tab.personal.active { background: var(--primary); }
body.traveling #view, body.traveling #tabs { pointer-events: none; opacity: .55; }
.placehead { display: flex; gap: 12px; align-items: center; }
.placehead h2 { margin: 0; }
.placehead p { margin: 2px 0; }
.placehead .pic { font-size: 2.6rem; line-height: 1; }
.card.goto { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; border-color: var(--line); }
.card.restroom { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
button.chip { cursor: pointer; font: inherit; font-size: .85rem; }
aside { background: var(--bg2); border-radius: var(--radius); padding: 8px 14px; box-shadow: var(--shadow); position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; }
#log { list-style: none; padding: 0; margin: 0; font-size: .85rem; }
#log li { padding: 6px 0; border-bottom: 1px solid var(--line); line-height: 1.35; }
#log li.good { color: var(--good); }
#log li.bad { color: var(--bad); }
#log .t { display: block; font-size: .72rem; color: var(--muted); }

footer#tip { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); color: #fff; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: .9rem; text-align: center; }

/* cards & grids */
.card { background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); border: 2px solid transparent; }
.grid { display: grid; gap: 10px; }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grid.actions { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.grid.jobs, .grid.shop, .grid.homes { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.grid.skills, .grid.goals { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.grid.sports { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.jt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pay { color: var(--good); font-weight: 700; white-space: nowrap; }

.card.job { border-color: var(--primary); }
.card.job.none { border-color: var(--warn); }
.card.job h3 { margin-top: 0; }

.action {
  background: var(--bg2); color: var(--ink); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; font-size: .9rem; transition: transform .1s, border-color .2s;
}
.action:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-2px); }
.action .ic { font-size: 1.8rem; }
.action small { color: var(--muted); font-size: .75rem; }
.action.locked { opacity: .5; cursor: not-allowed; }

.jobc.qual { border-color: #9fdcb4; }
.jobc.mine, .home.mine { border-color: var(--primary); }
.jobc .btn { margin-top: 8px; width: 100%; }
.reqs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.req { font-size: .75rem; padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }
.req.good { background: #e3f7ea; color: #17623a; }
.req.bad { background: #fde8e8; color: #9b2c2c; }
.filters select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: .95rem; background: var(--bg2); color: var(--ink); }

.item.owned { opacity: .85; }
.goal { display: flex; gap: 10px; align-items: center; opacity: .55; }
.goal.got { opacity: 1; border-color: #f5c66b; }
.goal .ic { font-size: 1.8rem; }
details { margin-top: 8px; }
summary { cursor: pointer; font-weight: 600; }
.trow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }

/* buttons */
.btn { border: none; border-radius: 10px; padding: 8px 14px; font-size: .95rem; font-weight: 600; cursor: pointer; background: var(--line); color: var(--ink); }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.btn.big { padding: 14px 24px; font-size: 1.1rem; width: 100%; margin-top: 16px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(10, 20, 35, .55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
#modal.open { display: flex; }
.modal-card { background: var(--bg2); color: var(--ink); border-radius: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal-card h2 { margin-top: 0; }
#modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.lesson { background: #eef4ff; border-left: 4px solid var(--primary); padding: 8px 10px; border-radius: 6px; color: #1d3557; }
.notes, .bracket { padding-left: 18px; }
.notes li, .bracket li { margin: 5px 0; line-height: 1.4; }
.bracket .win { color: var(--good); }
.bracket .loss { color: var(--bad); }
.tips li { margin: 6px 0; line-height: 1.4; }
.claims { display: grid; grid-template-columns: 1fr; gap: 4px; max-height: 45vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.claim { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.claim:hover { background: var(--bg); }
.claim.wanted { background: #fff7e0; color: #4a3500; }
.claim.wanted span:nth-child(2)::before { content: '⭐ '; }
.claim .lvl { font-size: .78rem; color: var(--muted); }
.claim.wanted .lvl { color: #7a5a00; }
.claim input { width: 18px; height: 18px; }
table.stub { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: .9rem; }
table.stub td { padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.stub td:last-child { text-align: right; white-space: nowrap; }
table.stub .minus td:last-child, td.minus { color: var(--bad); }
table.stub .plus td:last-child, td.plus { color: var(--good); }
table.stub .total td { font-weight: 700; border-top: 2px solid var(--ink); }

/* toasts */
#toasts { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #1d2b3a; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); transition: opacity .5s; font-weight: 600; max-width: 90vw; }
.toast.bad { background: var(--bad); }
.toast.good { background: var(--good); }
.toast.gone { opacity: 0; }

/* setup */
#setup { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: linear-gradient(135deg, #a8e0ff, #ffe1a8); }
.setup-card { background: #fff; color: #1d2b3a; border-radius: 22px; padding: 24px; max-width: 620px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
.setup-card h1 { font-size: 2.2rem; margin-top: 0; }
.setup-card label { display: block; font-weight: 600; margin: 14px 0 6px; }
.setup-card input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 1.1rem; border-radius: 10px; border: 2px solid #dbe4ee; }
.setup-card .label { font-weight: 600; margin: 14px 0 6px; }
.avatars { display: flex; flex-wrap: wrap; gap: 6px; }
.av { font-size: 1.8rem; background: #f3f7fb; border: 2px solid transparent; border-radius: 12px; padding: 4px 8px; cursor: pointer; }
.av.sel { border-color: var(--primary); background: #e3efff; }
.talents { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.tal { background: #f3f7fb; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; font-size: .9rem; color: #1d2b3a; }
.tal.sel { border-color: var(--good); background: #e3f7ea; }

/* mobile */
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  aside { position: static; max-height: 300px; }
}
@media (max-width: 600px) {
  #hud { grid-template-columns: 1fr 1fr; }
  .clock { grid-column: 1 / -1; grid-row: 2; }
  #needs { grid-template-columns: repeat(4, 1fr); }
  .placehead .pic { font-size: 2rem; }
  .need { font-size: .74rem; padding: 5px 8px; }
  .tab { min-width: 56px; padding: 6px 8px; }
  .grid.actions { grid-template-columns: repeat(2, 1fr); }
  footer#tip { font-size: .78rem; }
}

/* money */
.card.money { margin-top: 14px; border-color: #f5c66b; }
.card.money h3 { margin-top: 0; }
.mrows { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 2rem 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: none; }
.mrow .mi { font-size: 1.5rem; text-align: center; }
.mrow .mt { min-width: 0; display: flex; flex-direction: column; }
.mrow .mt small { color: var(--muted); }
.mrow .mb { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.pos { color: var(--good); }
.tablewrap { overflow-x: auto; }
table.stocks { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.stocks th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; }
table.stocks td { padding: 6px; border-top: 1px solid var(--line); vertical-align: middle; }
table.stocks .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.stocks .tbtn { display: flex; flex-wrap: wrap; gap: 3px; min-width: 150px; }
.spark.up { color: var(--good); }
.spark.down { color: var(--bad); }
.grid.ideas { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 12px; }
.card.idea { display: flex; gap: 10px; align-items: flex-start; }
.card.idea .num { background: var(--primary); color: #fff; border-radius: 999px; min-width: 1.8rem; height: 1.8rem; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.card.idea p { margin: 2px 0 0; }
@media (max-width: 600px) {
  .mrow { grid-template-columns: 2rem 1fr; }
  .mrow .mb { grid-column: 1 / -1; justify-content: flex-start; }
}
label.field { display: block; font-weight: 600; margin: 10px 0; }
label.field input, label.field select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }

/* characters */
img.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(#cfeaff, #e9f6ff); border: 2px solid var(--line); object-fit: cover; flex: none; }
img.avatar.big { width: 72px; height: 72px; }
.cc { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: start; }
.cc-preview { width: 170px; height: 204px; border-radius: 14px; border: 2px solid #dbe4ee; }
.cc-opts { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cc-row { display: flex; flex-direction: column; gap: 4px; }
.cc-label { font-size: .8rem; font-weight: 700; color: var(--muted); }
.setup-card .cc-label { color: #64748b; }
.swatches, .styles { display: flex; flex-wrap: wrap; gap: 5px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; }
.sw.sel { outline: 3px solid var(--primary); outline-offset: 2px; }
.st { border: 2px solid #dbe4ee; background: #f3f7fb; color: #1d2b3a; border-radius: 8px; padding: 3px 8px; font-size: .8rem; cursor: pointer; }
.st.sel { border-color: var(--primary); background: #e3efff; }
.cc-rand { align-self: flex-start; }
details.card { margin: 10px 0; }
details.card #restyle { margin-top: 10px; }
@media (max-width: 520px) { .cc { grid-template-columns: 1fr; justify-items: center; } .cc-opts { width: 100%; } }

/* inside your home */
.roomwrap { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); line-height: 0; border: 3px solid var(--bg2); margin-bottom: 8px; }
#room { width: 100%; display: block; }
.card.needbuy { border-color: var(--warn); margin: 8px 0; }
.chip.warn { background: #fff4dd; border-color: #f5c66b; color: #7a4d00; }
details.walls summary { cursor: pointer; }

/* world map controls */
.mapctl { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; line-height: 1; }
.mapctl button { width: 36px; height: 36px; border-radius: 10px; border: none; background: rgba(255,255,255,.92); color: #1d2b3a; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.mapctl button:hover { background: #fff; }
#minimap { position: absolute; left: 10px; bottom: 10px; width: 170px; border-radius: 8px; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }
.maphint { position: absolute; top: 10px; left: 10px; background: rgba(29,43,58,.75); color: #fff; font-size: .75rem; padding: 4px 8px; border-radius: 6px; line-height: 1.2; pointer-events: none; }
@media (max-width: 600px) { #minimap { width: 110px; } .maphint { display: none; } .mapctl button { width: 32px; height: 32px; } }

/* front door */
.doorbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--bg2); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.btn.big-door { font-size: 1.05rem; padding: 12px 22px; }

/* pets */
.card.pets { margin: 10px 0; border-color: #9fdcb4; }
.card.pets h3 { margin-top: 0; }
.grid.petgrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.petcard { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 3px; }
.pbar { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 6px; font-size: .78rem; }
.pbar .bar { margin: 0; }
.petshopcard canvas.petpic { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 8px; display: block; margin-bottom: 6px; }

/* ---------- real life: phone, holidays, quizzes, budget ---------- */
.phonebtn { position: relative; font-size: 1.6rem; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; cursor: pointer; box-shadow: var(--shadow); }
.phonebtn i, .apps i { position: absolute; top: -4px; right: -4px; background: var(--bad); color: #fff; font-style: normal; font-size: .7rem; border-radius: 99px; padding: 1px 6px; }
.phone { max-width: 360px; margin: 0 auto; background: #10151f; color: #e8eef7; border-radius: 28px; padding: 14px; border: 6px solid #2b3446; }
.phone .card { color: var(--ink); }
.phonetop { display: flex; align-items: center; gap: 8px; justify-content: center; padding-bottom: 10px; border-bottom: 1px solid #2b3446; margin-bottom: 10px; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.apps button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #e8eef7; font-size: .72rem; cursor: pointer; }
.apps button span { font-size: 1.6rem; background: #2b3446; border-radius: 14px; width: 52px; height: 52px; display: grid; place-items: center; }
.msgs { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
.msg { background: #2b3446; border-radius: 14px 14px 14px 4px; padding: 7px 10px; font-size: .88rem; align-self: flex-start; max-width: 90%; }
.msg.me { background: #2f80ed; border-radius: 14px 14px 4px 14px; align-self: flex-end; }
.phone .muted { color: #9fb0c8; }
.holiday { background: linear-gradient(135deg, #fff6e0, #ffe6f0); border: 2px solid #f6c36b; }
:root[data-theme="dark"] .holiday { background: linear-gradient(135deg, #3d3320, #3d2433); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .holiday { background: linear-gradient(135deg, #3d3320, #3d2433); } }
.sortgrid { display: flex; flex-direction: column; gap: 6px; }
.sortrow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; background: var(--bg); padding: 6px 10px; border-radius: 10px; }
.sortrow label, .quiz label { margin-right: 10px; white-space: nowrap; cursor: pointer; }
.quiz { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; padding: 8px 10px; background: var(--bg); border-radius: 10px; }
.budgetedit { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0; }
.budgetedit label { display: flex; flex-direction: column; font-size: .85rem; gap: 2px; }
.budgetedit input { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); }
.cand { display: flex; gap: 10px; align-items: flex-start; }
.energy .pbar { margin: 4px 0; }
.news li { margin: 4px 0; }
.talk { display: flex; gap: 14px; align-items: flex-start; }
.talk > img.avatar { width: 96px; height: 96px; flex: none; }
.bubble { position: relative; margin-top: 8px; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 1.02rem; line-height: 1.4; }
.bubble::before { content: ''; position: absolute; left: -10px; top: 14px; border: 8px solid transparent; border-right-color: var(--line); border-left: 0; }
@media (max-width: 600px) { .talk > img.avatar { width: 64px; height: 64px; } }
.guestpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.guest { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 8px 4px; cursor: pointer; color: var(--ink); }
.guest.sel { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, var(--bg2)); }
.guest img { width: 56px; height: 56px; }
.action.sel { outline: 3px solid var(--primary); }
.dinner { margin: 8px 0; text-align: center; }
.seats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.seat { display: flex; flex-direction: column; align-items: center; }
.seat img { width: 64px; height: 64px; }
.dtable { margin: -6px auto 0; max-width: 360px; background: linear-gradient(#a0703f, #7a5230); border-radius: 50px; padding: 10px; font-size: 1.4rem; letter-spacing: 6px; box-shadow: 0 6px 0 #5a3b20; }
.talk.small { margin: 6px 0; gap: 8px; }
.talk.small > img.avatar { width: 40px; height: 40px; }
.talk.small .bubble { margin-top: 2px; padding: 6px 10px; font-size: .92rem; }

const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const weekday = (d = S.day) => (d - 1) % 7;
const isWeekend = () => weekday() >= 5;
const has = id => !!S.owned[id];
const home = () => HOMES[S.home];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtTime(h) {
  let hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  if (mm === 60) { hh++; mm = 0; }
  hh = hh % 24;
  const ap = hh >= 12 ? 'PM' : 'AM';
  let h12 = hh % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ap}`;
}

function skillName(id) {
  if (SKILLS[id]) return `${SKILLS[id].icon} ${SKILLS[id].name}`;
  if (SPORTS[id]) return `${SPORTS[id].icon} ${SPORTS[id].name}`;
  return id;
}
function skillLevel(id) {
  if (id in S.skills) return S.skills[id];
  if (id in S.sports) return S.sports[id];
  return 0;
}
function addSkill(id, base) {
  const cur = skillLevel(id);
  const gain = Math.max(0.4, base * (1 - cur / 130));
  const next = Math.min(100, cur + gain);
  if (id in S.skills) S.skills[id] = next; else S.sports[id] = next;
  return next - cur;
}

function log(text, kind = '') {
  S.log.unshift({ t: `Day ${S.day} ${fmtTime(S.hour)}`, text, kind });
  if (S.log.length > 80) S.log.length = 80;
}
function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = text;
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstChild.remove();
  box.appendChild(el);
  setTimeout(() => el.classList.add('gone'), 2600);
  setTimeout(() => el.remove(), 3200);
}
function nope(text) { toast(text, 'bad'); }

// ---------- money ----------
function earn(amount, label) {
  S.money += amount;
  S.week.income += amount;
  S.week.lines.push({ label, amount });
}
function spend(amount, label) {
  if (S.money < amount) { nope(`You need ${money(amount)} but only have ${money(S.money)}.`); return false; }
  S.money -= amount;
  S.week.expenses += amount;
  S.week.lines.push({ label, amount: -amount });
  trackSpend(label, amount);
  return true;
}
// Bills get charged even if you can't afford them
function charge(amount, label) {
  const before = S.money;
  S.money -= amount;
  S.week.expenses += amount;
  S.week.lines.push({ label, amount: -amount });
  trackSpend(label, amount);
  if (before >= 0 && S.money < 0) {
    credit(-20, 'your account was overdrawn');
    S.money -= 35;
    S.week.expenses += 35;
    S.week.lines.push({ label: 'Overdraft fee (spent more than you had!)', amount: -35 });
    log(`💸 Your account went below $0. The bank charged a $35 overdraft fee!`, 'bad');
  }
}
function netWorth() {
  let w = S.money + S.savings - S.loan;
  const h = home();
  if (h.type === 'buy') w += h.price - (S.mortgage ? S.mortgage.balance : 0);
  if (has('car')) w += 3000;
  if (has('newcar')) w += 18000;
  return w + moneyAssets();
}

// ---------- time ----------
const RATES = {
  //        food  energy hygiene fun  bladder
  awake:  [-4,   -3.5,  -2,     -1,  -7],
  work:   [-4.5, -5,    -3,     -1.5, -7],
  study:  [-4,   -5,    -1.5,   -2,  -7],
  sport:  [-6,   -9,    -12,    3,   -6],
  relax:  [-3.5, -1,    -1,     6,   -7],
  sleep:  [-1.5, 0,     -1,     0,   -2.5],
};

function tick(h, mode) {
  const r = RATES[mode], n = S.needs;
  n.food += r[0] * h;
  n.hygiene += r[2] * h;
  n.fun += r[3] * h;
  n.bladder += r[4] * h;
  if (n.bladder <= 4) {
    if (mode === 'work' || mode === 'study' || mode === 'sport') {
      n.bladder = 100; S.handsDirty = false;          // bathroom break (public places have restrooms)
    } else if (mode === 'sleep') {
      n.bladder = 100; n.energy -= 4; S.nightWake = true; S.handsDirty = true;
    } else {
      n.bladder = 100; n.hygiene = Math.min(n.hygiene, 10); n.fun -= 25;
      S.laundryDays = Math.max(S.laundryDays, 8); S.accident = true;
    }
  }
  if (mode === 'sleep') {
    const per = 8.5 + home().comfort * 0.6 + (has('bed') ? 2 : hasF('mattress') ? 0 : -3);
    n.energy += per * h;
    if (n.food > 25) n.health += 1 * h;
  } else {
    n.energy += r[1] * h;
  }
  if (n.food <= 0) n.health -= 3 * h;
  petTick(h);
  lifeTick(h, mode);
  if (n.hygiene < 15) { n.health -= 0.4 * h; n.fun -= 1 * h; }
  if (n.fun < 10) n.health -= 0.3 * h;
  if (atHome() && has('couch') && mode === 'relax') n.fun += 2 * h;
  if (atHome() && mode !== 'sleep') n.fun += cozy() * 0.03 * h;
  if (atHome() && has('fan') && S.weather === 'hot') n.fun += 0.5 * h;
  for (const k in n) n[k] = clamp(n[k]);
  if (S.home === 'parents') n.fun = Math.min(n.fun, 80);
}

function pass(hours, mode = 'awake') {
  let left = hours;
  while (left > 0.0001) {
    const step = Math.min(1, left, 24 - S.hour);
    tick(step, mode);
    S.hour += step; left -= step;
    if (S.hour >= 24 - 1e-6) { S.hour = 0; newDay(); }
  }
}

function newDay() {
  // --- end of the old day ---
  const j = S.job;

    if (S.today.sick) {

      j.misses++;

  S.day++;
  moneyNewDay();
  homeNewDay();

  calendarNewDay();
  lifeNewDay();
  socialNewDay();
  carsNewDay();
  taxNewDay();
  buildNewDay();
  if (Math.random() < 0.025) emergencyEvent();

  if (weekday() === 0) weeklyBills();
  if (S.day >= 30) unlock('month');
  if (S.day >= 365) unlock('year');
  dailyEvent();
}

  log(`🚫 You were FIRED from ${j.name}. ${reason}`, 'bad');
  queueModal(`<h2>🚫 You're Fired!</h2><p>Your boss at <b>${j.name}</b> let you go.</p><p><i>${reason}</i></p>
    <p class="lesson">💡 Life lesson: Bosses count on you to show up, do good work, and be honest.</p>`);
  S.cooldown[S.job.id] = S.day + 14;
  S.job = null;
}

function quitJob() {
  if (!S.job) return;
  const j = JOBS[S.job.id];
  confirmModal(`Quit your job as <b>${j.name}</b>? You'll get paid for hours you already worked.`, () => {
    if (S.job.weekHours > 0) payday(true);
    log(`👋 You quit your job as ${j.name}.`);
    S.job = null;
    done();
  });
}

function startInterview(jobId) {
  const job = JOBS[jobId];
  if (isWeekend()) return nope('Businesses do interviews on weekdays (Mon–Fri).');
  if (S.hour < 8 || S.hour > 16) return nope('Interviews happen between 8 AM and 4 PM.');
  if (S.cooldown[jobId] && S.cooldown[jobId] > S.day) return nope(`They said to wait. You can re-apply on Day ${S.cooldown[jobId]}.`);
  if (S.job && S.job.id === jobId) return nope('You already work here!');

  const wanted = new Set(job.req.map(r => r.s));
  const all = Object.keys(SKILLS).concat(Object.keys(SPORTS));
  // show wanted first, then everything else sorted by your level
  all.sort((a, b) => (wanted.has(b) - wanted.has(a)) || (skillLevel(b) - skillLevel(a)));
  const rows = all.map(id => {
    const lvl = Math.round(skillLevel(id));
    const r = job.req.find(x => x.s === id);
    return `<label class="claim ${wanted.has(id) ? 'wanted' : ''}">
      <input type="checkbox" value="${id}">
      <span>${skillName(id)}</span>
      <span class="lvl">you: ${lvl}${r ? ` · they want ${r.lvl}` : ''}</span>
    </label>`;
  }).join('');

  showModal(`<h2>🤝 Interview: ${job.name}</h2>
    <p class="muted">${money(job.pay)}/hour · ${EDU_NAMES[job.edu]}${job.insurance ? ' · includes health insurance' : ''}</p>
    <p>The manager shakes your hand and asks: <b>"So, what can you do?"</b></p>
    <p class="muted">Pick up to <b>4</b> things to tell them. ⭐ = what the job posting asked for. Be honest... or take a risk?</p>
    <div class="claims">${rows}</div>`,
    [{ label: 'Cancel', cls: 'ghost' },
     { label: 'Tell them!', cls: 'primary', keepOpen: true, fn: () => {
        const picks = [...document.querySelectorAll('.claims input:checked')].map(i => i.value);
        if (picks.length === 0) { nope('Pick at least one thing to tell them.'); return false; }
        if (picks.length > 4) { nope('Only pick up to 4 things — keep it short!'); return false; }
        closeModal();
        doInterview(job, picks);
     } }]);
  // limit to 4 checks
  document.querySelectorAll('.claims input').forEach(cb => cb.addEventListener('change', () => {
    if (document.querySelectorAll('.claims input:checked').length > 4) { cb.checked = false; nope('Only 4 things!'); }
  }));
}

function doInterview(job, picks) {
  pass(1.5, 'awake');
  const notes = [];
  let score = 55;
  const lies = [];
  const n = S.needs;

  if (S.edu < job.edu) {
    notes.push(`❌ They checked your education. This job needs a <b>${EDU_NAMES[job.edu]}</b>. You have a ${EDU_NAMES[S.edu]}.`);
    score = -999;
  }
  if (n.hygiene < 35) { score -= 25; notes.push('🤢 You smelled bad. The manager kept stepping back. (Shower first!)'); }
  else notes.push('🙂 You looked clean and fresh.');
  const dressBonus = [0, 0, 8, 15][S.clothes] || 0;
  if (S.laundryDays > 7) { score -= 10; notes.push('👕 Your clothes were dirty and wrinkled. (Do laundry!)'); }
  else if (dressBonus > 0) { score += dressBonus; notes.push(`👔 You were dressed nicely. (+${dressBonus})`); }
  if (n.energy < 25) { score -= 10; notes.push('🥱 You yawned during the interview.'); }
  if (n.food < 15) { score -= 5; notes.push('🍽️ Your stomach growled loudly.'); }
  const commBonus = Math.round(S.skills.comm / 8);
  if (commBonus > 0) { score += commBonus; notes.push(`🗣️ Your talking skills helped you explain yourself. (+${commBonus})`); }

  for (const r of job.req) {
    const lvl = skillLevel(r.s);
    if (picks.includes(r.s)) {
      if (lvl >= r.lvl) {
        score += 15;
        notes.push(`✅ You said you're good at ${skillName(r.s)} — and it's true! (+15)`);
      } else if (Math.random() < 0.45 + (lvl / r.lvl) * 0.3) {
        score += 12; lies.push(r.s);
        notes.push(`😬 You said you're good at ${skillName(r.s)}... they believed you. (But you're not, really.)`);
      } else {
        score -= 30;
        notes.push(`🙈 You said you're good at ${skillName(r.s)}, so they asked you to show them. You couldn't. (-30)`);
      }
    } else {
      score -= 25;
      notes.push(`❓ They needed ${skillName(r.s)}, but you didn't mention it.${lvl >= r.lvl ? ' <b>You ARE good at it — you should have told them!</b>' : ''} (-25)`);
    }
  }
  for (const p of picks) {
    if (!job.req.find(r => r.s === p)) {
      if (skillLevel(p) >= 20) { score += 3; notes.push(`👍 They liked hearing about your ${skillName(p)}. (+3)`); }
      else notes.push(`🤷 ${skillName(p)} isn't really what they need.`);
    }
  }
  if (!has('phone') && job.pay >= 18 && score >= 60 && Math.random() < 0.25) {
    score = 0;
    notes.push('📵 They wanted to hire you, but couldn\'t reach you because you don\'t have a phone!');
  }

  score += interviewExtras(job, notes);
  const hired = score >= 60;
  if (hired) {
    const prev = S.job;
    if (prev) { if (prev.weekHours > 0) payday(true); log(`👋 You left ${JOBS[prev.id].name} for a new job.`); }
    S.job = { id: job.id, wage: job.pay, startDay: S.day + 1, daysWorked: 0, goodDays: 0, misses: 0, warnings: 0, lies, weekHours: 0 };
    setupWorkplace(S.job); giveBenefits(S.job);
    if (S.family) Object.values(S.family).forEach(m => m.rel = clamp(m.rel + 5));
    text('👩 Mom', `A new job as a ${job.name}?! We're so proud of you! ❤️`);
    if (!S.jobsWorked.includes(job.id)) S.jobsWorked.push(job.id);
    log(`🎉 You got hired as a ${job.name} for ${money(job.pay)}/hour! Start tomorrow.`, 'good');
    unlock('first_job');
    if (S.jobsWorked.length >= 5) unlock('five_jobs');
    if (job.name.startsWith('Pro ')) unlock('pro_athlete');
  } else {
    S.cooldown[job.id] = S.day + 3;
    log(`😞 You didn't get the ${job.name} job.`, 'bad');
  }
  showModal(`<h2>${hired ? '🎉 You\'re Hired!' : '😞 Not This Time'}</h2>
    <p>${hired ? `You are the new <b>${job.name}</b>! Your first day is <b>tomorrow</b> (weekdays). Go to work between 6 and 9 AM.`
                : `The ${job.name} job went to someone else. You can try again in 3 days.`}</p>
    <ul class="notes">${notes.map(x => `<li>${x}</li>`).join('')}</ul>
    ${lies.length ? '<p class="lesson">⚠️ You stretched the truth. If your boss finds out before you really learn those skills, you\'ll be fired!</p>' : ''}`,
    [{ label: 'OK' }]);
  done(false);
}

async function goWork() {
  const j = S.job; if (!j) return;
  const job = JOBS[j.id];
  const sh = shiftNow();
  if (S.day < j.startDay) return nope('Your first day is tomorrow!');
  if (!worksToday()) return nope(S.snowDay ? '❄️ Snow day! Work is closed today.' : holidayToday() && holidayToday().closed ? 'It\'s a holiday — work is closed!' : 'You don\'t work today. Enjoy your day off! 🎉');
  if (S.today.worked) return nope('You already worked today.');
  if (S.today.sick) return nope('You called in sick today. Rest up!');
  if (S.hour < sh.from) return nope(`It's too early. Your shift starts at ${fmtTime(sh.from + 0.5)}.`);
  if (S.hour >= sh.to) return nope('Too late — your shift already started. You could call in sick...');
  if (traveler) return;

  await travelTo(workplaceOf(job), { noDone: true, quiet: true });
  const late = S.hour > sh.late;
  const n = S.needs;
  let perf = (n.energy + n.food + n.hygiene + n.health) / 4 + rand(-8, 10) + S.clothes * 2;
  if (late) perf -= 20;
  if (S.laundryDays > 7) perf -= 8;
  if (n.bladder < 20) perf -= 5;
  if (n.thirst < 20) perf -= 5;
  if (S.ill) perf -= ILLNESS[S.ill.type].perf;
  if (!j.boss) setupWorkplace(j);
  if (j.boss.style === 'strict') perf -= 4; else if (j.boss.style === 'nice') perf += 3;
  S.today.worked = true;
  pass(8, 'work');
  const extra = workEvent(j);

  j.weekHours += 8; j.daysWorked++;
  job.req.forEach(r => addSkill(r.s, 1.2));

  const msgs = [];
  if (late) msgs.push('⏰ You were late!');
  let fired = false;
  if (perf >= 65) {
    j.goodDays++;
    msgs.push('Great work today! 👏');
    if (j.goodDays % 10 === 0) {
      const old = j.wage;
      j.wage = Math.round(j.wage * 1.08 * 100) / 100;
      log(`📈 RAISE! Your boss loves your work. Pay went from ${money(old)} to $${j.wage.toFixed(2)}/hour.`, 'good');
      queueModal(`<h2>📈 You Got a Raise!</h2><p>Your boss noticed how hard you work.</p><p>New pay: <b>$${j.wage.toFixed(2)}/hour</b> (was $${old.toFixed(2)})</p>`);
      unlock('raise');
    }
  } else if (perf < 35) {
    j.warnings++;
    msgs.push(`😠 You did a bad job. Boss warning ${j.warnings}/3.`);
    if (j.warnings >= 3) { log(`${job.name}: ${msgs.join(' ')}`, 'bad'); fire('You did poor work too many times. (Come to work rested, fed and clean!)'); fired = true; }
  } else msgs.push('An OK day at work.');
  if (extra) msgs.push(extra);

  if (!fired) {
    // were you caught lying?
    j.lies = j.lies.filter(s => skillLevel(s) < (job.req.find(r => r.s === s) || { lvl: 0 }).lvl);
    if (j.lies.length && Math.random() < 0.12) {
      log(`${job.name}: ${msgs.join(' ')}`);
      fire(`Your boss found out you can't really do ${skillName(j.lies[0])} like you said in your interview.`);
    } else {
      log(`💼 Worked 8 hours as ${job.name}. ${msgs.join(' ')}`, perf >= 65 ? 'good' : perf < 35 ? 'bad' : '');
    }
  }
  render();
  await travelTo('home', { quiet: true });
}

function callInSick() {
  const j = S.job; if (!j) return;
  if (!worksToday() || S.today.worked) return nope('You don\'t need to call in today.');
  if (S.today.sick) return nope('You already called in.');
  if (useSickDay()) { S.today.sick = true; return done(); }
  if (S.needs.health >= 70 && !S.ill) {
    j.warnings++;
    log(`📞 You called in sick, but you sounded fine. Your boss is suspicious. Warning ${j.warnings}/3.`, 'bad');
    if (j.warnings >= 3) fire('Too many warnings.');
  } else {
    log('📞 You called in sick. Your boss says feel better!');
  }
  S.today.sick = true;
  done();
}

function payday(final = false) {
  const j = S.job;
  if (!j || j.weekHours <= 0) return;
  const gross = j.weekHours * j.wage;
  const fed = gross * 0.10, state = gross * 0.04, fica = gross * 0.0765;
  const net = gross - fed - state - fica;
  S.taxYear.wages += gross; S.taxYear.withheld += fed + state;
  earn(net, `Paycheck from ${JOBS[j.id].name}`);
  log(`💵 Payday! ${j.weekHours} hours × $${j.wage.toFixed(2)} = ${money(gross)}. After taxes you got ${money(net)}.`, 'good');
  queueModal(`<h2>💵 ${final ? 'Final ' : ''}Paycheck</h2>
    <table class="stub">
      <tr><td>${JOBS[j.id].name}: ${j.weekHours} hrs × $${j.wage.toFixed(2)}</td><td>${money(gross)}</td></tr>
      <tr class="minus"><td>Federal income tax (10%)</td><td>-${money(fed)}</td></tr>
      <tr class="minus"><td>State income tax (4%)</td><td>-${money(state)}</td></tr>
      <tr class="minus"><td>Social Security & Medicare (7.65%)</td><td>-${money(fica)}</td></tr>
      <tr class="total"><td>Take-home pay</td><td>${money(net)}</td></tr>
    </table>
    <p class="lesson">💡 "Gross pay" is what you earned. "Net pay" is what you actually take home after taxes. Taxes pay for roads, schools, firefighters, and more.</p>`);
  j.weekHours = 0;
  unlock('first_check');
}

// ---------- weekly bills ----------
function weeklyBills() {
  const h = home();
  const bills = [];
  // housing
  if (h.type === 'rent') {
    if (S.money >= h.rent) { charge(h.rent, `Rent: ${h.name}`); bills.push([`Rent (${h.name})`, h.rent]); S.missedRent = 0; credit(3, 'paid rent on time'); }
    else {
      S.missedRent++; credit(-50, 'missed a rent payment');
      bills.push([`Rent — COULDN'T PAY! (${S.missedRent}/2)`, 0]);
      log(`🏚️ You couldn't pay rent! The landlord is angry. (${S.missedRent}/2)`, 'bad');
      if (S.missedRent >= 2) {
        log('📦 You were EVICTED. You moved back in with your parents.', 'bad');
        queueModal(`<h2>📦 Evicted!</h2><p>You missed rent twice, so the landlord made you leave. You moved back home with your parents.</p><p class="lesson">💡 Rent is usually the most important bill. Pay it first!</p>`);
        S.home = 'parents'; S.missedRent = 0;
      }
    }
    if (S.home !== 'parents') { const wi = Math.round(h.utilities * 0.6), el = electricBill(); charge(wi, 'Water & internet'); bills.push(['Water & internet', wi]); charge(el, 'Electric bill'); bills.push([`Electric bill (${S.kwh.toFixed(1)} kWh used)`, el]); }
  }
  if (h.type !== 'buy' && S.mortgage) {
    const pay = Math.min(S.mortgage.weekly, S.mortgage.balance);
    charge(pay, 'Construction loan payment'); bills.push(['Construction loan payment (for the house you are building)', pay]);
    S.mortgage.balance -= pay; credit(2, 'paid your loan on time');
    if (S.mortgage.balance <= 0.5) { S.mortgage = null; log('🎉 You paid off your loan!', 'good'); }
  }
  if (h.type === 'buy') {
    if (S.mortgage) {
      const pay = Math.min(S.mortgage.weekly, S.mortgage.balance);
      charge(pay, 'Mortgage payment'); bills.push(['Mortgage payment', pay]);
      S.mortgage.balance -= pay;
      if (S.mortgage.balance <= 0.5) { S.mortgage = null; log('🎉 You paid off your mortgage! You own your house completely!', 'good'); }
    }
    charge(h.upkeep, 'Property tax, water & internet'); bills.push(['Property tax, water & internet', h.upkeep]);
    const el = electricBill(); charge(el, 'Electric bill'); bills.push([`Electric bill (${S.kwh.toFixed(1)} kWh used)`, el]);
    if (S.mortgage) credit(3, 'paid your mortgage on time');
  }
  if (S.home === 'parents' && S.kwh > 25) log('👩 Mom says: "Turn off the lights when you leave a room! The electric bill was huge."');
  S.kwh = 0;
  if (has('phone')) { charge(20, 'Phone bill'); bills.push(['Phone bill', 20]); }
  if (has('car')) { charge(35, 'Car insurance'); bills.push(['Car insurance', 35]); }
  if (has('newcar')) { charge(45, 'New car insurance'); bills.push(['New car insurance', 45]); }
  if (S.insurance && !(S.job && JOBS[S.job.id].insurance)) { charge(35, 'Health insurance'); bills.push(['Health insurance', 35]); }
  // bank
  if (S.loan > 0) {
    const interest = S.loan * loanRate();
    credit(S.loan > loanLimit() * 0.6 ? -5 : 2, 'loan payments');
    S.loan += interest;
    bills.push([`Loan interest added (${(loanRate() * 100).toFixed(1)}%, from your credit score) — you now owe ${money(S.loan)}`, 0]);
    const min = Math.min(S.loan, Math.max(20, S.loan * 0.05));
    charge(min, 'Loan minimum payment'); S.loan -= min;
    bills.push(['Loan minimum payment', min]);
    if (S.loan < 0.5) { S.loan = 0; unlock('debt_free'); }
  }
  if (S.savings > 0) {
    const int = S.savings * 0.005;
    S.savings += int;
    S.week.lines.push({ label: 'Savings interest (0.5%)', amount: int });
  }

  // weekly summary
  const w = S.week;
  const total = bills.reduce((a, b) => a + b[1], 0);
  queueModal(`<h2>🧾 Monday: Bills Are Due</h2>
    <table class="stub">${bills.length ? bills.map(b => `<tr class="minus"><td>${b[0]}</td><td>${b[1] ? '-' + money(b[1]) : ''}</td></tr>`).join('')
      : '<tr><td>No bills this week! (Living with parents is cheap.)</td><td></td></tr>'}
      <tr class="total"><td>Total bills</td><td>${money(total)}</td></tr></table>
    <h3>Last week's budget</h3>
    <table class="stub">
      <tr><td>Money in</td><td class="plus">+${money(w.income)}</td></tr>
      <tr><td>Money out (before these bills)</td><td class="minus">-${money(w.expenses - total)}</td></tr>
    </table>
    <p>You now have <b>${money(S.money)}</b>${S.savings > 0 ? ` and ${money(S.savings)} in savings` : ''}.</p>
    ${S.money < 0 ? '<p class="lesson">⚠️ You have negative money! Find work or cut spending fast.</p>' : ''}
    ${budgetReport()}<p class="muted">📈 Credit score: ${S.credit} (${creditWord()})</p>`);
  if (S.money >= 0) credit(2, 'all bills paid');
  S.week = { income: 0, expenses: 0, lines: [], cats: {} };
  moneyWeekly();
}

// ---------- random events ----------
function dailyEvent() {
  if (S.plaque >= S.cavityAt) {
    const cost = S.insurance || (S.job && JOBS[S.job.id].insurance) ? 40 : 250;
    charge(cost, 'Dentist: cavity filled');
    S.plaque = 0; S.cavityAt = 60 + Math.floor(Math.random() * 31);
    S.needs.health = clamp(S.needs.health - 10);
    queueModal(`<h2>🦷 Ouch, a Cavity!</h2><p>Your tooth started to hurt. You haven't been brushing enough for a long time, so the dentist had to fill a cavity.</p><p>Bill: <b>${money(cost)}</b></p><p class="lesson">💡 Brush for 2 minutes, twice a day: after breakfast and after dinner. Brushing is free. Fixing cavities is not!</p>`);
    log(`🦷 Cavity! Dentist bill ${money(cost)}.`, 'bad');
    return;
  }
  if (Math.random() > 0.28) return;
  const ev = [];
  ev.push({ w: 3, f: () => { earn(20, 'Found money'); return ['💵 Lucky Day', 'You found $20 on the sidewalk!', '']; } });
  ev.push({ w: S.needs.hygiene < 40 ? 5 : 2, f: () => { S.needs.fun = clamp(S.needs.fun + 4); return ['☀️ Nice Day', 'You took a deep breath of fresh air and felt great.', '']; } });
  ev.push({ w: 2, f: () => { earn(50, 'Birthday card from Grandma'); return ['💌 Card from Grandma', 'Grandma sent you a card with $50 inside!', '']; } });
  ev.push({ w: 2, f: () => { charge(60, 'Gift for friend\'s wedding'); return ['💒 Wedding Invite', 'Your friend is getting married. You bought a $60 gift.', 'Some expenses are surprises. That\'s why saving matters.']; } });
  ev.push({ w: 2, f: () => { S.needs.fun = clamp(S.needs.fun + 20); return ['🎉 Party!', 'Your friends threw a party. Fun +20!', '']; } });
  if (has('car') && !has('newcar')) ev.push({ w: 3, f: () => { charge(400, 'Car repair'); return ['🔧 Car Trouble', 'Your used car broke down. Repair: $400.', 'Older cars cost less to buy, but need more repairs.']; } });
  if (has('car') || has('newcar')) ev.push({ w: 1, f: () => { charge(45, 'Parking ticket'); return ['🅿️ Parking Ticket', 'You parked in the wrong spot. $45 ticket!', '']; } });
  if (has('phone')) ev.push({ w: 1, f: () => { charge(120, 'Phone screen repair'); return ['📱 Cracked Screen', 'You dropped your phone. Repair: $120.', '']; } });
  if (home().type === 'buy') ev.push({ w: 2, f: () => { charge(600, 'Home repair: broken pipe'); return ['🚰 Broken Pipe!', 'A pipe burst in your house. The plumber charged $600.', 'Homeowners pay for their own repairs.']; } });
  if (home().type === 'rent') ev.push({ w: 2, f: () => ['🚰 Leaky Sink', 'Your sink broke. The landlord fixed it for free!', 'When you rent, the landlord pays for most repairs.'] });
  if (!S.taxRefundDone && S.day > 40 && S.jobsWorked.length) ev.push({ w: 5, f: () => { S.taxRefundDone = true; earn(300, 'Tax refund'); return ['📬 Tax Refund', 'The government says you paid a little too much tax last year. Here\'s $300 back!', 'Each year people file a "tax return" to check if they paid the right amount.']; } });
  ev.push({ w: 2, f: () => { S.needs.fun = clamp(S.needs.fun + 10); addSkill('comm', 2); return ['🙋 Volunteering', 'You helped at the food bank. You feel good and made new friends.', 'Helping others is a big part of life too.']; } });

  moneyEvents(ev);
  const total = ev.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * total;
  for (const e of ev) {
    r -= e.w;
    if (r <= 0) {
      const [title, text, lesson] = e.f();
      log(`${title}: ${text}`);
      queueModal(`<h2>${title}</h2><p>${text}</p>${lesson ? `<p class="lesson">💡 ${lesson}</p>` : ''}`);
      return;
    }
  }
}

function ateFood(amount) {
  S.needs.food = clamp(S.needs.food + amount);
  S.needs.bladder = clamp(S.needs.bladder - 8);   // you drink something with your meal
  if (S.handsDirty && Math.random() < 0.3) {
    S.needs.health = clamp(S.needs.health - 15);
    S.needs.fun = clamp(S.needs.fun - 10);
    log('🤢 You got a tummy ache. You ate without washing your hands after using the toilet!', 'bad');
    if (Math.random() < 0.35) getSick('stomach');
    toast('🤢 Tummy ache! Wash your hands before eating.', 'bad');
  }
}

  S.needs.bladder = 100;
  S.handsDirty = true;

}
function washHands() {
  pass(0.04);
  S.handsDirty = false;
  S.needs.hygiene = clamp(S.needs.hygiene + 3);
  log('🧼 You washed your hands with soap. Germs gone!');
}

// ---------- town places ----------
function seeDoctor() {
  if (S.hour < 7 || S.hour > 21) return nope('The clinic is open 7 AM to 10 PM. (The emergency room is always open if your health hits zero.)');
  const insured = S.insurance || (S.job && JOBS[S.job.id].insurance);
  const cost = insured ? 20 : 150;
  if (!spend(cost, 'Doctor visit')) return;

function takeClass(skill) {

  const sk = SKILLS[skill];
  if (!spend(sk.price, `${sk.name} class`)) return;
  pass(2, 'study');
  const g = addSkill(skill, 7);
  log(`🏫 You took a ${sk.name} class. Skill +${g.toFixed(1)}`, 'good');
  done();
}
function library(skill) {
  if (S.hour < 8 || S.hour > 20) return nope('The library is open 8 AM to 9 PM.');
  if (S.needs.energy < 15) return nope('You\'re too tired to study.');
  pass(3, 'study');
  const g = addSkill(skill, 3);
  log(`📚 You studied ${SKILLS[skill].name} at the library for free. Skill +${g.toFixed(1)}`);

function attendSchool(lvl) {
  const e = EDUCATION.find(x => x.level === lvl);
  if (S.edu < e.needs) return nope(`You need a ${EDU_NAMES[e.needs]} first.`);
  if (S.edu >= lvl) return nope('You already finished this!');
  if (S.hour < 8 || S.hour > 18) return nope('Classes are from 8 AM to 6 PM.');
  if (S.needs.energy < 20) return nope('Too tired for class!');
  if (!spend(e.price, `${e.name} tuition`)) return;
  pass(e.hours, 'study');
  S.eduProgress[lvl]++;
  ['math', 'write', 'sci', 'comp', 'comm'].forEach(s => addSkill(s, lvl === 2 ? 1.3 : 1.6));
  if (S.eduProgress[lvl] >= e.sessions) {
    S.edu = lvl;
    unlock(lvl === 2 ? 'college' : 'grad');
    log(`🎓 GRADUATION! You earned your ${EDU_NAMES[lvl]}!`, 'good');
    queueModal(`<h2>🎓 Congratulations, Graduate!</h2><p>You earned your <b>${EDU_NAMES[lvl]}</b>!</p><p>Lots of new jobs are open to you now. Check the 💼 Job Center.</p>`);
  } else log(`🎒 You went to ${e.name}. (${S.eduProgress[lvl]}/${e.sessions} classes)`);
  done();
}

function lesson(sp, pro) {

  if (pro && S.sports[sp] < 40) return nope('The pro coach only trains players at level 40+.');
  const price = pro ? s.pro : s.lesson;
  if (!spend(price + (s.practiceFee || 0), `${s.name} ${pro ? 'pro coach' : 'lesson'}`)) return;

function tournament(sp, tid) {
  const s = SPORTS[sp], t = TOURNAMENTS.find(x => x.id === tid);
  if (!isWeekend()) return nope('Tournaments are on weekends (Saturday & Sunday).');
  if (S.hour < 7 || S.hour > 13) return nope('Tournaments start between 7 AM and 1 PM.');
  if (S.today['t_' + sp]) return nope(`You already played a ${s.name} tournament today.`);
  if (!sportReady(sp)) return;
  if (!spend(t.fee, `${t.name} entry fee`)) return;
  S.today['t_' + sp] = true;
  trySport(sp);

  const rounds = ['Quarterfinal', 'Semifinal', 'Final'];
  const lines = [];
  let place = 0;
  for (let i = 0; i < 3; i++) {
    const opp = clamp(t.opp + i * 5 + rand(-10, 10), 1, 99);
    const me = S.sports[sp] + (S.needs.energy - 60) / 8 + (S.skills.fit - 20) / 10 + rand(-6, 6);
    const pWin = 1 / (1 + Math.exp(-(me - opp) / 7));
    const win = Math.random() < pWin;
    lines.push(`<li class="${win ? 'win' : 'loss'}">${rounds[i]} vs. opponent (level ${Math.round(opp)}): <b>${win ? 'WON ✅' : 'Lost ❌'}</b></li>`);
    S.needs.energy = clamp(S.needs.energy - 12);
    if (!win) { place = i === 2 ? 2 : (i === 1 ? 3 : 5); break; }
    if (i === 2) place = 1;
  }
  pass(5, 'sport');
  addSkill(sp, 1.5);
  sportsInjury();
  let prize = 0;
  if (place === 1) prize = t.prize1; else if (place === 2) prize = t.prize2;
  if (prize) earn(prize, `${t.name} prize`);
  const medal = { 1: '🥇 1st place!', 2: '🥈 2nd place!', 3: '🥉 Made the semifinals', 5: 'Out in the first round' }[place];
  if (place === 1) {
    sponsorChance(sp, tid);
    S.trophies.push({ sport: sp, t: tid, day: S.day });
    unlock('tourney');
    if (tid === 'national') unlock('national');
  }
  log(`${s.icon} ${t.name} (${s.name}): ${medal}${prize ? ` Won ${money(prize)}!` : ''}`, place <= 2 ? 'good' : '');
  showModal(`<h2>${s.icon} ${t.name}</h2><ul class="bracket">${lines.join('')}</ul>
    <h3>${medal}</h3>${prize ? `<p>Prize money: <b>${money(prize)}</b> 🏆</p>` : ''}
    ${place > 1 ? '<p class="lesson">💡 Keep practicing and taking lessons. Getting good takes time!</p>' : ''}`, [{ label: 'OK' }]);
  done(false);
}

// ---------- housing ----------
function weeklyIncome() { return S.job ? S.job.wage * 40 * 0.78 : 0; }

function moveTo(hid) {
  const h = HOMES[hid];
  if (hid === S.home) return;
  if (S.home !== 'parents' && home().type === 'buy') return nope('Sell your house first.');
  if (!petsOkFor(hid)) return;
  if (h.type === 'free') {
    confirmModal('Move back in with your parents? (No rent, but less fun.)', () => { S.home = 'parents'; log('🏡 You moved back home.'); pass(3); done(); });
    return;
  }
  if (h.type === 'rent') {
    const need = h.rent * 2.5;
    if (S.credit < 500) return showModal(`<h2>🏢 Application Denied</h2><p>The landlord checked your credit score (<b>${S.credit}</b>) and said no.</p><p class="lesson">💡 Pay bills on time to raise your credit score. Landlords want to know you'll pay rent!</p>`, [{ label: 'OK' }]);
    if (weeklyIncome() < need && S.money + S.savings < h.rent * 12) {
      return showModal(`<h2>🏢 Application Denied</h2><p>The landlord says you need to earn at least <b>${money(need)}/week</b> after taxes, or have ${money(h.rent * 12)} saved.</p><p>You earn ${money(weeklyIncome())}/week.</p><p class="lesson">💡 Landlords check your income to make sure you can pay rent. Most want rent to be less than 1/3 of your pay.</p>`, [{ label: 'OK' }]);
    }
    const upfront = h.rent * 2;
    confirmModal(`Rent the <b>${h.name}</b>?<br>Move-in cost: <b>${money(upfront)}</b> (first week + security deposit).<br>Then ${money(h.rent)} rent + ${money(h.utilities)} utilities every Monday.`, () => {
      if (!spend(upfront, `Move in: ${h.name}`)) return;
      S.home = hid; S.missedRent = 0;
      pass(4);
      homeWelcome();
      log(`🔑 You moved into a ${h.name}!`, 'good');
      unlock('moved_out');
      done();
    });
    return;
  }
  // buy
  const down = h.price * 0.1;
  const loanAmt = h.price - down;
  const total = loanAmt * 1.4;
  const weekly = Math.round(total / 520);
  const canCash = S.money >= h.price;
  showModal(`<h2>${h.icon} Buy a ${h.name}</h2><p>Price: <b>${money(h.price)}</b></p>
    <p><b>Option 1: Pay cash</b> — ${money(h.price)} now. No mortgage!</p>
    <p><b>Option 2: Mortgage</b> (a loan for a house) — ${money(down)} down payment now, then <b>${money(weekly)}/week</b> for 10 years.
    You'd pay ${money(total + down)} total because of interest.</p>
    <p>Either way: ${money(h.upkeep)}/week for property tax & utilities.</p>
    <p class="lesson">💡 Banks want your weekly payment to be less than 40% of your income. You earn ${money(weeklyIncome())}/week.</p>`,
    [{ label: 'Cancel', cls: 'ghost' },
     { label: 'Mortgage', fn: () => {
        if (S.credit < 620) { queueModal(`<h2>🏦 Mortgage Denied</h2><p>Your credit score is <b>${S.credit}</b>. Banks want at least <b>620</b> for a home loan.</p><p class="lesson">💡 A good credit score comes from paying bills on time for a long time.</p>`); return done(); }
        if (weeklyIncome() * 0.4 < weekly) { queueModal(`<h2>🏦 Mortgage Denied</h2><p>The bank says your income is too low for a ${money(weekly)}/week payment. You need to earn at least ${money(weekly / 0.4)}/week.</p>`); return done(); }
        if (!spend(down, `Down payment: ${h.name}`)) return;
        S.mortgage = { balance: total, weekly };
        finishBuy(hid);
     } },
     { label: `Pay Cash`, cls: canCash ? 'primary' : 'ghost', fn: () => {
        if (!spend(h.price, `Bought ${h.name}`)) return;
        S.mortgage = null;
        finishBuy(hid);
     } }]);
}
function finishBuy(hid) {
  S.home = hid; S.missedRent = 0;
  homeWelcome();
  pass(6);
  log(`🏠 You bought a ${HOMES[hid].name}! Welcome home!`, 'good');
  unlock('homeowner'); unlock('moved_out');
  done();
}
function sellHouse() {
  const h = home();
  const val = h.price * 0.95;
  const owe = S.mortgage ? S.mortgage.balance : 0;
  confirmModal(`Sell your ${h.name} for ${money(val)}? ${owe ? `You still owe ${money(owe)} on the mortgage, so you'd get ${money(val - owe)}.` : ''} You'll move back with your parents.`, () => {
    earn(val - owe, `Sold ${h.name}`);
    S.mortgage = null;
    if (S.home === 'custom') { PLACES[S.build.lot].kind = 'land'; S.build = null; }
    S.home = 'parents';
    log(`🏷️ You sold your house and moved back home.`);
    done();
  });
}

// ---------- bank ----------
function loanLimit() { return Math.round(1000 + weeklyIncome() * 30 + (S.edu < 3 ? 3000 : 0)); }
function bank(action, amt) {
  if (S.hour < 8 || S.hour > 20) return nope('The bank is open 8 AM to 9 PM.');
  if (amt === 'all') amt = action === 'deposit' ? Math.floor(S.money) : action === 'withdraw' ? S.savings : Math.min(S.loan, Math.floor(S.money));
  if (!(amt > 0)) return nope('Nothing to do.');
  if (action === 'deposit') {
    if (amt > S.money) return nope('You don\'t have that much cash.');
    S.money -= amt; S.savings += amt;
    log(`🏦 You put ${money(amt)} in savings.`);
    if (S.savings >= 1000) unlock('save1k');
  } else if (action === 'withdraw') {
    amt = Math.min(amt, S.savings);
    S.savings -= amt; S.money += amt;
    log(`🏦 You took ${money(amt)} out of savings.`);
  } else if (action === 'borrow') {
    if (S.loan + amt > loanLimit()) return nope(`The bank will only lend you up to ${money(loanLimit())} total.`);
    S.loan += amt; S.money += amt;
    log(`🏦 You borrowed ${money(amt)}. It grows 2% every week until you pay it back!`, 'bad');
  } else if (action === 'repay') {
    amt = Math.min(amt, S.loan);
    if (amt > S.money) return nope('You don\'t have that much cash.');
    S.loan -= amt; S.money -= amt;
    log(`🏦 You paid back ${money(amt)} of your loan.`, 'good');
    if (S.loan < 0.5) { S.loan = 0; unlock('debt_free'); }
  }
  done();
}
function toggleInsurance() {
  S.insurance = !S.insurance;
  log(S.insurance ? '🩺 You signed up for health insurance ($35/week).' : '🩺 You cancelled health insurance.');
  done();
}

// ---------- after every action ----------
function checkBody() {
  const n = S.needs;
  if (S.nightWake) { S.nightWake = false; log('🌙 You woke up in the night to use the bathroom.'); }
  if (S.accident) {
    S.accident = false;
    log('😳 Oops! You didn\'t make it to the bathroom in time.', 'bad');
    queueModal(`<h2>😳 Oops!</h2><p>You waited too long and didn't make it to the bathroom in time. Your clothes need washing and you need a shower.</p><p class="lesson">💡 When the 🚽 Bathroom bar gets low, go! Every store, school and workplace has a restroom.</p>`);
  }
  if (n.health <= 0) {
    const insured = S.insurance || (S.job && JOBS[S.job.id].insurance);
    const bill = insured ? 300 : 3000;
    charge(bill, 'Hospital bill');
    n.health = 60; n.food = 60; n.energy = 60;
    const startHour = S.hour;
    pass(24 - startHour + 7, 'sleep');
    log(`🏥 You got really sick and went to the hospital. Bill: ${money(bill)}.`, 'bad');
    queueModal(`<h2>🏥 Hospital!</h2><p>Your health hit zero, so you spent the night in the hospital.</p><p>Bill: <b>${money(bill)}</b>${insured ? ' (health insurance paid most of it!)' : ''}</p><p class="lesson">💡 ${insured ? 'Health insurance saved you a lot of money!' : 'Without health insurance, hospital bills are HUGE. Eat, sleep and stay clean!'}</p>`);
  } else if (n.energy <= 0) {
    log('😵 You were so tired you passed out!', 'bad');
    pass(6, 'sleep');
    queueModal(`<h2>😵 You Passed Out!</h2><p>You ran out of energy and fell asleep for 6 hours.</p><p class="lesson">💡 Get 8 hours of sleep each night.</p>`);
  }
}

function checkAchievements() {
  const w = netWorth();
  if (w >= 10000) unlock('worth10k');
  if (w >= 100000) unlock('worth100k');
  if (w >= 1000000) unlock('millionaire');
  if (S.savings >= 1000) unlock('save1k');
}
function unlock(id) {
  if (S.achievements[id]) return;
  S.achievements[id] = S.day;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) { log(`🏅 Life Goal reached: ${a.name}!`, 'good'); toast(`🏅 Goal: ${a.icon} ${a.name}`, 'good'); }
}

function done(showQueued = true) {
  checkBody();
  checkAchievements();
  save();
  render();
  if (showQueued) nextModal();
}

// ---------- modals ----------
function showModal(html, buttons = [{ label: 'OK' }]) {
  const m = $('#modal');
  $('#modal-body').innerHTML = html;
  const bar = $('#modal-buttons');
  bar.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.className = 'btn ' + (b.cls || 'primary');
    btn.onclick = () => {
      if (b.keepOpen) { b.fn && b.fn(); return; }
      closeModal();
      if (b.fn) b.fn();
      else nextModal();
    };
    bar.appendChild(btn);
  });
  m.classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }
function queueModal(html) { modalQueue.push(html); }
function nextModal() {
  if ($('#modal').classList.contains('open')) return;
  const h = modalQueue.shift();
  if (h) showModal(h, [{ label: 'OK' }]);
}
function confirmModal(html, fn) {
  showModal(`<p>${html}</p>`, [{ label: 'Cancel', cls: 'ghost' }, { label: 'Yes', cls: 'primary', fn }]);
}

// ---------- save ----------
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) return JSON.parse(s); } catch (e) { /* ignore */ }
  return null;
}
function resetGame() {
  confirmModal('Start a brand new life? Your current game will be erased.', () => {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    S = null; modalQueue.length = 0;
    showSetup();
  });
}

  <script>
// ===================== PEOPLE =====================
// Draws people (the player and townspeople) instead of using emojis.

const LOOKS = {
  skin:  ['#fde0c8', '#f3c9a0', '#e0a878', '#c4885a', '#9a6440', '#6b4129'],
  hair:  ['#2a1c14', '#4e3020', '#8a5230', '#c98b3c', '#e8c870', '#b8b2aa', '#a8332a', '#141414'],
  style: ['short', 'long', 'curly', 'bun', 'ponytail', 'buzz', 'spiky', 'braids'],
  shirt: ['#2f80ed', '#e53935', '#2e9d58', '#f2b705', '#8e44ad', '#f07d1a', '#f5f5f5', '#36454f', '#e86aa6', '#1abc9c'],
  pants: ['#24395e', '#3d4650', '#6b4a35', '#1e1e1e', '#7a8794', '#4a6b3a'],
};
const STYLE_NAMES = { short: 'Short', long: 'Long', curly: 'Curly', bun: 'Bun', ponytail: 'Ponytail', buzz: 'Buzz cut', spiky: 'Spiky', braids: 'Braids' };

function randomLook(r = Math.random) {
  const pick = a => a[Math.floor(r() * a.length)];
  return { skin: pick(LOOKS.skin), hair: pick(LOOKS.hair), style: pick(LOOKS.style), shirt: pick(LOOKS.shirt), pants: pick(LOOKS.pants) };
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt * 255)));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// (x, y) is where the feet touch the ground. s = size (1 = about 38px tall).
function drawPerson(c, x, y, s, look, phase = 0, moving = false) {
  const sw = moving ? Math.sin(phase) * 3 * s : 0;
  const bounce = moving ? Math.abs(Math.cos(phase)) * 1.2 * s : 0;
  y -= bounce;
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  // shadow
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x + 1.5 * s, y + bounce + 0.5 * s, 8 * s, 2.6 * s, 0, 0, Math.PI * 2); c.fill();
  // long hair / braids behind the body
  const hy = y - 31 * s;
  if (look.style === 'long') { c.fillStyle = shade(look.hair, -0.05); rrPath(c, x - 7.5 * s, hy - 4 * s, 15 * s, 17 * s, 5 * s); c.fill(); }
  if (look.style === 'braids') { c.strokeStyle = look.hair; c.lineWidth = 2.6 * s; [-1, 1].forEach(d => { c.beginPath(); c.moveTo(x + d * 6 * s, hy); c.lineTo(x + d * 6.5 * s, y - 17 * s); c.stroke(); }); }
  // legs
  c.lineWidth = 3.6 * s;
  c.strokeStyle = shade(look.pants, -0.06);
  c.beginPath(); c.moveTo(x - 2.2 * s, y - 13 * s); c.lineTo(x - 2.2 * s - sw, y - 2.5 * s); c.stroke();
  c.strokeStyle = look.pants;
  c.beginPath(); c.moveTo(x + 2.2 * s, y - 13 * s); c.lineTo(x + 2.2 * s + sw, y - 2.5 * s); c.stroke();
  // shoes
  [[x - 2.4 * s - sw, -1], [x + 2.4 * s + sw, 1]].forEach(([fx, d]) => {
    c.fillStyle = '#2b2b2b'; c.beginPath(); c.ellipse(fx + d * 0.4 * s, y - 1.6 * s, 2.6 * s, 1.5 * s, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f2f2f2'; c.fillRect(fx - 2.4 * s + d * 0.4 * s, y - 0.9 * s, 4.8 * s, 0.6 * s);
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(fx + d * 0.4 * s - 0.8 * s, y - 2.3 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); c.fill();
  });
  // pant leg crease
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 0.5 * s;
  c.beginPath(); c.moveTo(x - 2.2 * s, y - 12 * s); c.lineTo(x - 2.2 * s - sw, y - 3.5 * s); c.moveTo(x + 2.2 * s, y - 12 * s); c.lineTo(x + 2.2 * s + sw, y - 3.5 * s); c.stroke();
  // arms (behind)
  c.lineWidth = 3 * s;
  c.strokeStyle = shade(look.shirt, -0.12);
  c.beginPath(); c.moveTo(x - 5.5 * s, y - 23.5 * s); c.lineTo(x - 7 * s + sw * 0.8, y - 15 * s); c.stroke();
  c.beginPath(); c.moveTo(x + 5.5 * s, y - 23.5 * s); c.lineTo(x + 7 * s - sw * 0.8, y - 15 * s); c.stroke();
  c.fillStyle = look.skin;
  c.beginPath(); c.arc(x - 7 * s + sw * 0.8, y - 14 * s, 1.7 * s, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + 7 * s - sw * 0.8, y - 14 * s, 1.7 * s, 0, Math.PI * 2); c.fill();
  // body
  const g = c.createLinearGradient(x - 6 * s, 0, x + 6 * s, 0);
  g.addColorStop(0, shade(look.shirt, 0.08)); g.addColorStop(1, shade(look.shirt, -0.12));
  c.fillStyle = g; rrPath(c, x - 6 * s, y - 26 * s, 12 * s, 14 * s, 3.5 * s); c.fill();
  c.strokeStyle = shade(look.shirt, -0.2); c.lineWidth = 0.5 * s;
  c.beginPath(); c.moveTo(x - 3 * s, y - 20 * s); c.quadraticCurveTo(x - 1 * s, y - 17 * s, x - 3.5 * s, y - 14.5 * s);
  c.moveTo(x + 3.5 * s, y - 21 * s); c.quadraticCurveTo(x + 2 * s, y - 18 * s, x + 3.8 * s, y - 15 * s); c.stroke();
  c.fillStyle = shade(look.shirt, 0.15);
  c.beginPath(); c.moveTo(x - 3.2 * s, y - 26 * s); c.lineTo(x, y - 23 * s); c.lineTo(x - 1 * s, y - 26.2 * s); c.fill();
  c.beginPath(); c.moveTo(x + 3.2 * s, y - 26 * s); c.lineTo(x, y - 23 * s); c.lineTo(x + 1 * s, y - 26.2 * s); c.fill();
  c.fillStyle = '#3a2a1e'; c.fillRect(x - 6 * s, y - 14 * s, 12 * s, 1.8 * s);
  c.fillStyle = '#c9a54a'; c.fillRect(x - 1.1 * s, y - 14.2 * s, 2.2 * s, 2.2 * s);
  c.fillStyle = shade(look.shirt, -0.3); c.fillRect(x - 0.5 * s, y - 13.6 * s, 1 * s, 1 * s);
  // neck + head
  c.fillStyle = shade(look.skin, -0.08); c.fillRect(x - 1.6 * s, y - 27.5 * s, 3.2 * s, 2.5 * s);
  const hg = c.createRadialGradient(x - 2 * s, hy - 2 * s, 1 * s, x, hy, 7.5 * s);
  hg.addColorStop(0, shade(look.skin, 0.06)); hg.addColorStop(1, shade(look.skin, -0.08));
  c.fillStyle = hg; c.beginPath(); c.arc(x, hy, 6.5 * s, 0, Math.PI * 2); c.fill();
  // ears
  c.fillStyle = shade(look.skin, -0.05);
  c.beginPath(); c.arc(x - 6.4 * s, hy + 0.5 * s, 1.4 * s, 0, Math.PI * 2); c.arc(x + 6.4 * s, hy + 0.5 * s, 1.4 * s, 0, Math.PI * 2); c.fill();
  // face
  [-1, 1].forEach(d => {
    const ex = x + d * 2.3 * s, ey = hy + 0.5 * s;
    c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(ex, ey, 1.35 * s, 1 * s, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#4a3222'; c.beginPath(); c.arc(ex, ey + 0.1 * s, 0.75 * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#111'; c.beginPath(); c.arc(ex, ey + 0.1 * s, 0.4 * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 0.3 * s, ey - 0.25 * s, 0.22 * s, 0, Math.PI * 2); c.fill();
    c.strokeStyle = shade(look.hair, -0.1); c.lineWidth = 0.55 * s;
    c.beginPath(); c.moveTo(ex - d * 1.4 * s, ey - 1.9 * s); c.quadraticCurveTo(ex, ey - 2.5 * s, ex + d * 1.3 * s, ey - 2 * s); c.stroke();
  });
  c.strokeStyle = shade(look.skin, -0.25); c.lineWidth = 0.5 * s;
  c.beginPath(); c.moveTo(x + 0.2 * s, hy + 0.8 * s); c.quadraticCurveTo(x + 0.9 * s, hy + 2 * s, x - 0.2 * s, hy + 2.2 * s); c.stroke();
  c.fillStyle = 'rgba(240,120,120,.35)';
  c.beginPath(); c.arc(x - 3.6 * s, hy + 2.6 * s, 1.2 * s, 0, Math.PI * 2); c.arc(x + 3.6 * s, hy + 2.6 * s, 1.2 * s, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#7a3b2e'; c.lineWidth = 0.8 * s;
  c.beginPath(); c.arc(x, hy + 2.6 * s, 1.8 * s, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  // hair on top
  const hairG = c.createLinearGradient(x - 6 * s, hy - 8 * s, x + 6 * s, hy);
  hairG.addColorStop(0, shade(look.hair, 0.16)); hairG.addColorStop(0.5, look.hair); hairG.addColorStop(1, shade(look.hair, -0.12));
  c.fillStyle = hairG;
  const cap = (r = 6.9) => { c.beginPath(); c.arc(x, hy - 0.4 * s, r * s, Math.PI * 1.02, Math.PI * 1.98); c.closePath(); c.fill(); };
  switch (look.style) {
    case 'short':
      cap(); c.beginPath(); c.ellipse(x - 2 * s, hy - 4.6 * s, 4.5 * s, 2.2 * s, -0.3, 0, Math.PI * 2); c.fill(); break;
    case 'long':
      cap(7.2); c.beginPath(); c.ellipse(x + 1.5 * s, hy - 4.8 * s, 5 * s, 2.3 * s, 0.25, 0, Math.PI * 2); c.fill(); break;
    case 'curly':
      for (let a = 0; a <= 8; a++) { const ang = Math.PI * (1 + a / 8); c.beginPath(); c.arc(x + Math.cos(ang) * 6.3 * s, hy + Math.sin(ang) * 6 * s, 2.6 * s, 0, Math.PI * 2); c.fill(); }
      break;
    case 'bun':
      cap(); c.beginPath(); c.arc(x, hy - 8.3 * s, 3 * s, 0, Math.PI * 2); c.fill(); break;
    case 'ponytail':
      cap(); c.beginPath(); c.ellipse(x + 7 * s, hy + 1 * s, 2.3 * s, 5 * s, -0.4, 0, Math.PI * 2); c.fill(); break;
    case 'buzz':
      c.globalAlpha = 0.75; cap(6.7); c.globalAlpha = 1; break;
    case 'spiky':
      cap();
      for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(x + k * 2.6 * s - 1.8 * s, hy - 5 * s); c.lineTo(x + k * 2.6 * s, hy - 10 * s + Math.abs(k) * 0.8 * s); c.lineTo(x + k * 2.6 * s + 1.8 * s, hy - 5 * s); c.fill(); }
      break;
    case 'braids':
      cap(); break;
  }
  if (look.style !== 'buzz') {
    c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 0.7 * s;
    c.beginPath(); c.arc(x - 0.5 * s, hy - 1 * s, 5.2 * s, Math.PI * 1.2, Math.PI * 1.5); c.stroke();
  }
  c.restore();
}
function rrPath(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

const avatarCache = {};
function avatarURL(look, size = 64) {
  const key = JSON.stringify(look) + size;
  if (avatarCache[key]) return avatarCache[key];
  const cv = document.createElement('canvas');
  cv.width = size * 2; cv.height = size * 2;
  const c = cv.getContext('2d');
  // a portrait: head and shoulders, zoomed in
  const s = size * 2 / 26;
  drawPerson(c, size, size * 2 + 15 * s, s, look);
  return (avatarCache[key] = cv.toDataURL());
}
function avatarImg(look, size = 44, cls = 'avatar') {
  return `<img class="${cls}" src="${avatarURL(look, size)}" width="${size}" height="${size}" alt="">`;
}

// ---------- character creator ----------
function characterCreator(el, look, onChange) {
  const sw = (key, vals) => `<div class="cc-row"><span class="cc-label">${{ skin: 'Skin', hair: 'Hair color', shirt: 'Shirt', pants: 'Pants' }[key]}</span><div class="swatches">${vals.map(v => `<button type="button" class="sw ${look[key] === v ? 'sel' : ''}" data-k="${key}" data-v="${v}" style="background:${v}" aria-label="${key} ${v}"></button>`).join('')}</div></div>`;
  el.innerHTML = `<div class="cc">
    <canvas class="cc-preview" width="200" height="240"></canvas>
    <div class="cc-opts">
      ${sw('skin', LOOKS.skin)}
      <div class="cc-row"><span class="cc-label">Hair style</span><div class="styles">${LOOKS.style.map(v => `<button type="button" class="st ${look.style === v ? 'sel' : ''}" data-k="style" data-v="${v}">${STYLE_NAMES[v]}</button>`).join('')}</div></div>
      ${sw('hair', LOOKS.hair)}
      ${sw('shirt', LOOKS.shirt)}
      ${sw('pants', LOOKS.pants)}
      <button type="button" class="btn ghost sm cc-rand">🎲 Surprise me</button>
    </div></div>`;
  const cv = el.querySelector('.cc-preview');
  let t0 = 0;
  const draw = (t = 0) => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    const g = c.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, '#cfeaff'); g.addColorStop(0.7, '#e9f6ff'); g.addColorStop(0.7, '#8fd17a'); g.addColorStop(1, '#73bb60');
    c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
    drawPerson(c, 100, 215, 4.6, look, t / 160, false);
  };
  draw();
  el.querySelectorAll('[data-k]').forEach(btn => btn.onclick = () => {
    look[btn.dataset.k] = btn.dataset.v;
    el.querySelectorAll(`[data-k="${btn.dataset.k}"]`).forEach(b => b.classList.toggle('sel', b === btn));
    draw(); onChange && onChange(look);
  });
  el.querySelector('.cc-rand').onclick = () => {
    Object.assign(look, randomLook());
    characterCreator(el, look, onChange);
    onChange && onChange(look);
  };
}

// ---------- roads & paths ----------
const NODES = [];
V_ROADS.forEach(x => H_ROADS.forEach(y => NODES.push([x, y])));
const nodeAt = (x, y) => NODES.findIndex(n => n[0] === x && n[1] === y);
const EDGES = [];
H_ROADS.forEach(y => { for (let i = 0; i < V_ROADS.length - 1; i++) EDGES.push([nodeAt(V_ROADS[i], y), nodeAt(V_ROADS[i + 1], y)]); });
V_ROADS.forEach(x => { for (let i = 0; i < H_ROADS.length - 1; i++) EDGES.push([nodeAt(x, H_ROADS[i]), nodeAt(x, H_ROADS[i + 1])]); });
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

function nearestRoadPoint(p) {
  let best = null;
  EDGES.forEach(([a, b], i) => {
    const A = NODES[a], B = NODES[b];
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const t = Math.max(0, Math.min(1, ((p[0] - A[0]) * dx + (p[1] - A[1]) * dy) / (dx * dx + dy * dy)));
    const q = [A[0] + dx * t, A[1] + dy * t];
    const d = dist(p, q);
    if (!best || d < best.d) best = { d, q, edge: i };
  });
  return best;
}

function findPath(fromLoc, toLoc) {
  const A = placeOf(fromLoc).door, B = placeOf(toLoc).door;
  if (placeId(fromLoc) === placeId(toLoc)) return [A];
  const s = nearestRoadPoint(A), t = nearestRoadPoint(B);
  const S_ = NODES.length, T_ = S_ + 1;
  const pts = NODES.concat([s.q, t.q]);
  const adj = pts.map(() => []);
  const link = (i, j) => { const d = dist(pts[i], pts[j]); adj[i].push([j, d]); adj[j].push([i, d]); };
  EDGES.forEach(([a, b]) => link(a, b));
  link(S_, EDGES[s.edge][0]); link(S_, EDGES[s.edge][1]);
  link(T_, EDGES[t.edge][0]); link(T_, EDGES[t.edge][1]);
  if (s.edge === t.edge) link(S_, T_);
  const D = pts.map(() => Infinity), prev = pts.map(() => -1), seen = pts.map(() => false);
  D[S_] = 0;
  for (;;) {
    let u = -1;
    D.forEach((d, i) => { if (!seen[i] && d < Infinity && (u < 0 || d < D[u])) u = i; });
    if (u < 0 || u === T_) break;
    seen[u] = true;
    adj[u].forEach(([v, w]) => { if (D[u] + w < D[v]) { D[v] = D[u] + w; prev[v] = u; } });
  }
  const route = [];
  for (let u = T_; u >= 0; u = prev[u]) route.unshift(pts[u]);
  return [A, ...route, B];
}
function pathLength(path) { let L = 0; for (let i = 1; i < path.length; i++) L += dist(path[i - 1], path[i]); return L; }

// ---------- seeded random so the town looks the same every time ----------
function seeded(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

  c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(x + 1, y + 1, w * 0.35, h * 0.35);

}
function winGrid(c, x, y, w, h, cols, rows, ww, wh, glass, frame) {

const SHADE = [];

function tree(c, x, y, s, rnd) {
  c.save(); c.filter = 'blur(3px)'; ell(c, x + s * 0.7, y + s * 0.15, s * 1.15, s * 0.5, 'rgba(15,40,15,.35)'); c.restore();

function house(c, x, y, w, h, wall, roof, rnd, opts = {}) {
  // yard
  fillR(c, x, y, w, h, lawnCol('#8fd17a'), 4);
  flowers(c, x + 4, y + h - 14, w - 8, 10, rnd);
  const bw = w * 0.62, bh = h * 0.42, bx = x + (w - bw) / 2, by = y + h * 0.42;
  shadow(c, bx, by, bw, bh);
  fillR(c, bx, by, bw, bh, wall);
  // chimney
  fillR(c, bx + bw * 0.7, y + h * 0.12, 8, h * 0.2, '#8b4a3a');
  tri(c, [[bx - 7, by + 1], [bx + bw / 2, y + h * 0.08], [bx + bw + 7, by + 1]], roof);
  c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 1;
  for (let i = 1; i < 4; i++) { const yy = y + h * 0.08 + (by - y - h * 0.08) * i / 4; c.beginPath(); c.moveTo(bx + bw / 2 - (yy - y - h * 0.08) * (bw / 2 + 7) / (by - y - h * 0.08), yy); c.lineTo(bx + bw / 2 + (yy - y - h * 0.08) * (bw / 2 + 7) / (by - y - h * 0.08), yy); c.stroke(); }
  // door & windows
  fillR(c, bx + bw / 2 - 5, by + bh - 17, 10, 17, '#6b3e26', 2);
  circ(c, bx + bw / 2 + 3, by + bh - 8, 1, '#ffd23f');
  win(c, bx + 7, by + 7, 12, 10);
  win(c, bx + bw - 19, by + 7, 12, 10);

}

// grass colors change with the seasons (white snow in winter, golden in fall)
function lawnCol(hex) {
  if (typeof SEASON_LAND === 'undefined' || !SEASON_LAND) return hex;
  const [r, g, b, k] = SEASON_LAND, v = parseInt(hex.slice(1), 16);
  const mix = (a, t) => Math.round(a + (t - a) * k).toString(16).padStart(2, '0');

function drawStatic(c) {

  g.addColorStop(0, '#86c96f'); g.addColorStop(1, '#73bb60');
  c.fillStyle = g; c.fillRect(0, 0, MAP_W, MAP_H);
  // soft patches of lighter and darker grass
  for (let i = 0; i < 260; i++) {
    const px = rnd() * MAP_W, py = rnd() * MAP_H, pr = 25 + rnd() * 80;
    const pg = c.createRadialGradient(px, py, 0, px, py, pr);

function transportFor(len) {
  if (canDrive(len)) return { how: 'drove', icon: '🚙', speed: 3000, cost: 0, wait: 0 };
  if (has('bike')) return { how: 'biked', icon: '🚲', speed: 1500, cost: 0, wait: 0 };

  if (perk('busfare')) fare = Math.ceil(fare / 2);
  if (len > 350 && S.money >= fare) return { how: 'took the bus', icon: '🚌', speed: len > 2500 ? 2800 : 2200, cost: fare, wait: 0.15 };

  let hours = len < 5 ? 0 : Math.max(0.1, len / tr.speed + tr.wait);
  let rush = false;
  if (isRush() && (tr.icon === '🚙' || tr.icon === '🚌')) { hours *= 1.6; rush = true; }

}

function travelTo(dest, opts = {}) {
  return new Promise(resolve => {
    if (!S || traveler) return resolve(false);
    if (placeId(dest) === placeId(S.loc)) { S.loc = dest; if (!opts.keepTab) tab = dest; render(); return resolve(true); }

      if (info.cost) charge(info.cost, 'Bus fare');
      S.loc = dest;

      else S.insideOf = null;                       // ...or outside the building's door
